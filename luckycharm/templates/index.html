<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyCharm - Bird Detection Speed Demo</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🍀 LuckyCharm</h1>
            <p class="subtitle">AI-Powered Bird Detection Speed Demo</p>
        </header>

        <!-- Gong Section -->
        <section class="gong-section">
            <div class="gong-container" id="gongContainer">
                <div class="gong" id="gong">
                    <div class="gong-inner">
                        <div class="gong-symbol">🔔</div>
                    </div>
                </div>
                <div class="ripple" id="ripple"></div>
            </div>
            <p class="gong-instruction" id="gongInstruction">Click the gong to start processing!</p>
        </section>

        <!-- Stats Dashboard -->
        <section class="stats-dashboard" id="statsSection" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="imagesProcessed">0</div>
                <div class="stat-label">Images Processed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="birdsDetected">0</div>
                <div class="stat-label">Birds Detected</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="processingSpeed">0</div>
                <div class="stat-label">Images/Second</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="elapsedTime">0s</div>
                <div class="stat-label">Elapsed Time</div>
            </div>
        </section>

        <!-- Progress Bar -->
        <section class="progress-section" id="progressSection" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p class="progress-text" id="progressText">0 / 0 images</p>
        </section>

        <!-- Results Gallery -->
        <section class="results-section" id="resultsSection" style="display: none;">
            <h2>Processed Images</h2>
            <div class="gallery" id="gallery"></div>
        </section>

        <!-- Final Summary -->
        <section class="summary-section" id="summarySection" style="display: none;">
            <div class="summary-card">
                <h2>🎉 Processing Complete!</h2>
                <div class="summary-stats">
                    <div class="summary-item">
                        <span class="summary-label">Total Images:</span>
                        <span class="summary-value" id="summaryImages">0</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Total Birds:</span>
                        <span class="summary-value" id="summaryBirds">0</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Average Speed:</span>
                        <span class="summary-value" id="summarySpeed">0 img/s</span>
                    </div>
                    <div class="summary-item">
                        <span class="summary-label">Total Time:</span>
                        <span class="summary-value" id="summaryTime">0s</span>
                    </div>
                </div>
                <button class="reset-btn" onclick="location.reload()">Process More Images</button>
            </div>
        </section>
    </div>

    <script src="/static/js/gong-sound.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
