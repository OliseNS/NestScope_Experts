<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Species Labeling - Nestperts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0F0F0F;
            color: #E0E0E0;
            overflow-x: hidden;
        }

        /* Navbar */
        .navbar {
            background: #1E1E1E;
            border-bottom: 1px solid #333;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .navbar-links {
            display: flex;
            gap: 1rem;
        }

        .navbar-link {
            color: #A0A0A0;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .navbar-link:hover {
            color: #CC785C;
            background: rgba(204, 120, 92, 0.1);
        }

        /* Main Layout */
        .container {
            display: grid;
            grid-template-columns: 250px 1fr;
            height: calc(100vh - 70px);
        }

        /* Sidebar */
        .sidebar {
            background: #1A1A1A;
            border-right: 1px solid #333;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1rem;
            margin-bottom: 1rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .cluster-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .cluster-item {
            background: #252526;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cluster-item:hover {
            border-color: #CC785C;
            background: #2A2A2A;
        }

        .cluster-item.active {
            border-color: #CC785C;
            background: rgba(204, 120, 92, 0.1);
        }

        .cluster-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .cluster-name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .cluster-badge {
            background: #CC785C;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .cluster-progress-bar {
            width: 100%;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .cluster-progress-fill {
            height: 100%;
            background: #CC785C;
            transition: width 0.3s;
        }

        .cluster-stats {
            font-size: 0.75rem;
            color: #999;
            margin-top: 0.25rem;
        }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-rows: auto 1fr auto;
            overflow: hidden;
        }

        /* Header */
        .content-header {
            background: #1A1A1A;
            border-bottom: 1px solid #333;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-info h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .header-info p {
            color: #999;
            font-size: 0.9rem;
        }

        .overall-progress {
            text-align: right;
        }

        .progress-text {
            font-size: 2rem;
            font-weight: 700;
            color: #CC785C;
        }

        .progress-label {
            font-size: 0.85rem;
            color: #999;
        }

        /* Labeling Area */
        .labeling-area {
            display: grid;
            grid-template-columns: 500px 1fr;
            gap: 2rem;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Current Bird */
        .current-bird {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .bird-image-container {
            background: #1A1A1A;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }

        .bird-image {
            width: 100%;
            height: 400px;
            object-fit: contain;
            background: #000;
            border-radius: 4px;
        }

        .bird-info {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #999;
        }

        /* Species Selection */
        .species-selection {
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .species-selection h3 {
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .species-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .species-button {
            background: #252526;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 0.75rem 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-family: inherit;
            color: #E0E0E0;
        }

        .species-button:hover {
            border-color: #CC785C;
            background: #2A2A2A;
        }

        .species-button.selected {
            border-color: #CC785C;
            background: rgba(204, 120, 92, 0.2);
        }

        .species-code {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .species-name {
            font-size: 0.75rem;
            color: #999;
        }

        .keyboard-hint {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: #CC785C;
            color: white;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .confidence-selector {
            margin-bottom: 1.5rem;
        }

        .confidence-selector label {
            display: block;
            margin-bottom: 0.5rem;
            color: #999;
            font-size: 0.9rem;
        }

        .confidence-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .confidence-button {
            flex: 1;
            background: #252526;
            border: 2px solid #333;
            border-radius: 6px;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            color: #E0E0E0;
            font-size: 0.9rem;
        }

        .confidence-button:hover {
            border-color: #CC785C;
        }

        .confidence-button.selected {
            border-color: #CC785C;
            background: rgba(204, 120, 92, 0.2);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #CC785C;
            color: white;
        }

        .btn-primary:hover {
            background: #B86A4F;
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #333;
            color: #E0E0E0;
        }

        .btn-secondary:hover {
            background: #444;
        }

        /* Reference Panel */
        .reference-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .context-birds, .reference-photos {
            background: #1A1A1A;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .context-birds h3, .reference-photos h3 {
            margin-bottom: 1rem;
            font-size: 1rem;
            color: #999;
        }

        .context-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .context-bird {
            position: relative;
            aspect-ratio: 1;
            border-radius: 4px;
            overflow: hidden;
        }

        .context-bird img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .context-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.8);
            padding: 0.25rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .help-text {
            background: rgba(204, 120, 92, 0.1);
            border: 1px solid #CC785C;
            border-radius: 6px;
            padding: 1rem;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .help-text strong {
            color: #CC785C;
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            color: #999;
        }

        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #CC785C;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-right: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <div class="navbar-brand">
            <span>🦅</span>
            <span>Nestperts - Species Labeling</span>
        </div>
        <div class="navbar-links">
            <a href="/" class="navbar-link">← Back Home</a>
            <a href="/clusters" class="navbar-link">View Clusters</a>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Clusters</h2>
            <div class="cluster-list" id="clusterList">
                <div class="loading">
                    <div class="spinner"></div>
                    <span>Loading...</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="content-header">
                <div class="header-info">
                    <h1 id="clusterTitle">Select a cluster to begin</h1>
                    <p id="clusterDescription">Choose a cluster from the sidebar</p>
                </div>
                <div class="overall-progress">
                    <div class="progress-text" id="overallProgress">0%</div>
                    <div class="progress-label">Overall Progress</div>
                </div>
            </div>

            <!-- Labeling Area -->
            <div class="labeling-area" id="labelingArea">
                <div class="empty-state">
                    <h2>👈 Select a cluster to start labeling</h2>
                    <p style="margin-top: 1rem; color: #666;">
                        Clustering groups visually similar birds together,<br>
                        making it easier to identify species.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentCluster = null;
        let currentBird = null;
        let selectedSpecies = null;
        let selectedConfidence = 'high';
        let allSpecies = [];
        let keyboardMap = {};

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            loadSpeciesList();
            setupKeyboardShortcuts();
        });

        // Load overall progress and cluster list
        async function loadProgress() {
            try {
                const response = await fetch('/api/labeling/progress');
                const data = await response.json();

                if (data.status === 'success') {
                    updateOverallProgress(data);
                    renderClusterList(data.clusters);
                }
            } catch (error) {
                console.error('Error loading progress:', error);
                document.getElementById('clusterList').innerHTML = `
                    <div style="padding: 1rem; color: #FF6464;">
                        Error loading clusters. Make sure you've run clustering first!
                    </div>
                `;
            }
        }

        // Load species list for dropdown
        async function loadSpeciesList() {
            try {
                const response = await fetch('/api/species/list');
                const data = await response.json();

                if (data.status === 'success') {
                    allSpecies = data.species;
                }
            } catch (error) {
                console.error('Error loading species:', error);
            }
        }

        // Update overall progress display
        function updateOverallProgress(data) {
            const percentage = Math.round(data.progress * 100);
            document.getElementById('overallProgress').textContent = `${percentage}%`;
        }

        // Render cluster list in sidebar
        function renderClusterList(clusters) {
            const container = document.getElementById('clusterList');

            if (clusters.length === 0) {
                container.innerHTML = '<div class="empty-state">No clusters found</div>';
                return;
            }

            container.innerHTML = clusters.map(cluster => {
                const progress = Math.round(cluster.progress * 100);
                const isComplete = progress === 100;

                return `
                    <div class="cluster-item ${cluster.cluster_id === currentCluster ? 'active' : ''}"
                         onclick="selectCluster(${cluster.cluster_id})">
                        <div class="cluster-item-header">
                            <div class="cluster-name">Cluster ${cluster.cluster_id}</div>
                            ${isComplete ? '<div class="cluster-badge">✓</div>' : ''}
                        </div>
                        <div class="cluster-stats">${cluster.labeled}/${cluster.total} birds</div>
                        <div class="cluster-progress-bar">
                            <div class="cluster-progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Select a cluster
        async function selectCluster(clusterId) {
            currentCluster = clusterId;

            // Update UI
            document.querySelectorAll('.cluster-item').forEach(el => {
                el.classList.remove('active');
            });
            event.target.closest('.cluster-item').classList.add('active');

            // Load cluster info
            const infoResponse = await fetch(`/api/labeling/cluster/${clusterId}/info`);
            const info = await infoResponse.json();

            if (info.status === 'success') {
                document.getElementById('clusterTitle').textContent = `Cluster ${clusterId}`;
                document.getElementById('clusterDescription').textContent =
                    `${info.unlabeled_count} birds remaining • ${Math.round(info.progress * 100)}% complete`;
            }

            // Load next bird
            loadNextBird(clusterId);
        }

        // Load next bird to label
        async function loadNextBird(clusterId) {
            try {
                const response = await fetch(`/api/labeling/cluster/${clusterId}/next`);
                const data = await response.json();

                if (data.completed) {
                    // Cluster complete!
                    showCompletionMessage(clusterId);
                    return;
                }

                currentBird = data;
                selectedSpecies = null;
                renderLabelingInterface(data);

            } catch (error) {
                console.error('Error loading bird:', error);
            }
        }

        // Render the labeling interface
        function renderLabelingInterface(bird) {
            const area = document.getElementById('labelingArea');

            // Filter species based on cluster suggestions
            const suggestedSpecies = bird.suggested_species || [];
            const speciesOptions = suggestedSpecies.length > 0
                ? allSpecies.filter(s => suggestedSpecies.includes(s.code))
                : allSpecies;

            // Create keyboard shortcuts (1-9 for first 9 species)
            keyboardMap = {};
            speciesOptions.slice(0, 9).forEach((species, index) => {
                keyboardMap[String(index + 1)] = species.code;
            });

            area.innerHTML = `
                <!-- Current Bird -->
                <div class="current-bird">
                    <div class="bird-image-container">
                        <img src="/api/bird_crop/${bird.bird_id}"
                             alt="Bird ${bird.bird_id}"
                             class="bird-image">
                        <div class="bird-info">
                            Bird ID: ${bird.bird_id} • Image: ${bird.image_name}
                        </div>
                    </div>

                    <div class="species-selection">
                        <h3>Select Species</h3>
                        <div class="species-grid">
                            ${speciesOptions.slice(0, 12).map((species, index) => `
                                <button class="species-button" onclick="selectSpecies('${species.code}')">
                                    ${index < 9 ? `<div class="keyboard-hint">${index + 1}</div>` : ''}
                                    <div class="species-code">${species.code}</div>
                                    <div class="species-name">${species.name}</div>
                                </button>
                            `).join('')}
                        </div>

                        ${suggestedSpecies.length > 0 ? `
                            <div class="help-text">
                                <strong>💡 Smart Filtering Active:</strong>
                                Showing ${speciesOptions.length} species commonly found in this cluster.
                                This makes labeling easier!
                            </div>
                        ` : ''}

                        <div class="confidence-selector">
                            <label>Confidence Level:</label>
                            <div class="confidence-buttons">
                                <button class="confidence-button selected" onclick="selectConfidence('high')">
                                    High
                                </button>
                                <button class="confidence-button" onclick="selectConfidence('medium')">
                                    Medium
                                </button>
                                <button class="confidence-button" onclick="selectConfidence('low')">
                                    Low
                                </button>
                            </div>
                        </div>

                        <div class="action-buttons">
                            <button class="btn btn-primary" id="saveButton" disabled onclick="saveLabel()">
                                Save & Next (Enter)
                            </button>
                            <button class="btn btn-secondary" onclick="skipBird()">
                                Skip (S)
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Reference Panel -->
                <div class="reference-panel">
                    ${bird.context_birds && bird.context_birds.length > 0 ? `
                        <div class="context-birds">
                            <h3>🔍 Other birds in this cluster</h3>
                            <div class="context-grid">
                                ${bird.context_birds.map(contextBird => `
                                    <div class="context-bird">
                                        <img src="/api/bird_crop/${contextBird.bird_id}" alt="Context bird">
                                        <div class="context-label">${contextBird.species}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="help-text">
                        <strong>⌨️ Keyboard Shortcuts:</strong><br>
                        • Press <strong>1-9</strong> to select species<br>
                        • Press <strong>Enter</strong> to save and continue<br>
                        • Press <strong>S</strong> to skip<br>
                        • Press <strong>H/M/L</strong> for confidence level
                    </div>
                </div>
            `;
        }

        // Select species
        function selectSpecies(code) {
            selectedSpecies = code;

            // Update UI
            document.querySelectorAll('.species-button').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.closest('.species-button').classList.add('selected');

            // Enable save button
            document.getElementById('saveButton').disabled = false;
        }

        // Select confidence
        function selectConfidence(level) {
            selectedConfidence = level;

            // Update UI
            document.querySelectorAll('.confidence-button').forEach(btn => {
                btn.classList.remove('selected');
            });
            event.target.classList.add('selected');
        }

        // Save label
        async function saveLabel() {
            if (!selectedSpecies || !currentBird) return;

            try {
                const response = await fetch(`/api/labeling/bird/${currentBird.bird_id}/label`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        species: selectedSpecies,
                        confidence: selectedConfidence,
                        cluster_id: currentBird.cluster_id
                    })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    // Update progress
                    updateOverallProgress(data.progress);
                    loadProgress(); // Refresh cluster list

                    // Load next bird
                    loadNextBird(currentCluster);
                }

            } catch (error) {
                console.error('Error saving label:', error);
                alert('Error saving label. Please try again.');
            }
        }

        // Skip bird
        function skipBird() {
            // TODO: Implement skip functionality (mark for review)
            loadNextBird(currentCluster);
        }

        // Show completion message
        function showCompletionMessage(clusterId) {
            const area = document.getElementById('labelingArea');
            area.innerHTML = `
                <div class="empty-state">
                    <h2>🎉 Cluster ${clusterId} Complete!</h2>
                    <p style="margin-top: 1rem;">
                        All birds in this cluster have been labeled.
                    </p>
                    <button class="btn btn-primary" onclick="loadProgress()" style="margin-top: 2rem; max-width: 300px;">
                        Continue to Next Cluster
                    </button>
                </div>
            `;
        }

        // Keyboard shortcuts
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                // Ignore if typing in input
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                // Number keys (1-9) for species
                if (keyboardMap[e.key]) {
                    const speciesButton = document.querySelector(
                        `.species-button[onclick*="${keyboardMap[e.key]}"]`
                    );
                    if (speciesButton) speciesButton.click();
                }

                // Enter to save
                if (e.key === 'Enter' && selectedSpecies) {
                    saveLabel();
                }

                // S to skip
                if (e.key === 's' || e.key === 'S') {
                    skipBird();
                }

                // H/M/L for confidence
                if (e.key === 'h' || e.key === 'H') {
                    document.querySelector('.confidence-button[onclick*="high"]').click();
                }
                if (e.key === 'm' || e.key === 'M') {
                    document.querySelector('.confidence-button[onclick*="medium"]').click();
                }
                if (e.key === 'l' || e.key === 'L') {
                    document.querySelector('.confidence-button[onclick*="low"]').click();
                }
            });
        }
    </script>
</body>
</html>
