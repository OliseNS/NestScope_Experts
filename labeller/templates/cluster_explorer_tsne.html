<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NestScope — Cluster Explorer</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07070f;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Full-viewport canvas ── */
    #c {
      display: block;
      position: fixed;
      inset: 0;
      cursor: grab;
    }
    #c.panning { cursor: grabbing; }

    /* ────────────────────────────────────────
       HUD: TOP BAR
    ──────────────────────────────────────── */
    #hud-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(7,7,15,0.88);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      border-bottom: 1px solid rgba(255,255,255,0.055);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 14px;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .logo-mark {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #CC785C 0%, #e8936e 100%);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(204,120,92,0.35);
    }
    .logo-text {
      font-size: 13px;
      font-weight: 700;
      color: #e8e8f0;
      letter-spacing: -0.01em;
    }
    .logo-sub {
      font-size: 10px;
      color: #444;
      font-weight: 500;
    }

    .hud-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.07); flex-shrink: 0; }

    .hud-stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 48px;
    }
    .hud-stat-v {
      font-size: 12px;
      font-weight: 700;
      color: #CC785C;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .hud-stat-l {
      font-size: 9px;
      color: #3a3a52;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #hud-zoom {
      font-size: 10px;
      color: #3a3a52;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      min-width: 56px;
      text-align: right;
    }

    .hud-spacer { flex: 1; }

    /* ── HUD: cluster panel toggle ── */
    #btn-panel {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px;
      background: rgba(204,120,92,0.10);
      border: 1px solid rgba(204,120,92,0.20);
      border-radius: 7px;
      color: #CC785C;
      font-size: 11px; font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    #btn-panel:hover { background: rgba(204,120,92,0.18); border-color: rgba(204,120,92,0.35); }
    #btn-panel.active { background: rgba(204,120,92,0.22); }

    /* ── Back link ── */
    #back-link {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 7px;
      color: #555;
      font-size: 11px;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #back-link:hover { background: rgba(255,255,255,0.08); color: #999; }

    /* ────────────────────────────────────────
       HUD: CLUSTER PANEL (right slide-over)
    ──────────────────────────────────────── */
    #cluster-panel {
      position: fixed;
      top: 48px; right: 0;
      width: 234px;
      height: calc(100vh - 48px);
      background: rgba(7,7,15,0.92);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      border-left: 1px solid rgba(255,255,255,0.055);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transform: translateX(0);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    #cluster-panel.hidden { transform: translateX(100%); }

    .cp-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .cp-title {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #3a3a52;
    }
    .cp-count {
      font-size: 11px;
      color: #555;
      margin-top: 3px;
    }

    #cluster-list {
      flex: 1;
      overflow-y: auto;
      padding: 5px 0;
      scrollbar-width: thin;
      scrollbar-color: #1e1e2e transparent;
    }
    #cluster-list::-webkit-scrollbar { width: 3px; }
    #cluster-list::-webkit-scrollbar-thumb { background: #1e1e2e; border-radius: 2px; }

    .ci {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.1s;
      border-left: 2px solid transparent;
      border-right: 2px solid transparent;
    }
    .ci:hover  { background: rgba(255,255,255,0.04); }
    .ci.active {
      background: rgba(204,120,92,0.09);
      border-left-color: var(--clr);
    }
    .ci-swatch {
      width: 10px; height: 10px;
      border-radius: 3px;
      background: var(--clr);
      flex-shrink: 0;
      box-shadow: 0 0 4px color-mix(in srgb, var(--clr) 40%, transparent);
    }
    .ci-name  { flex: 1; font-size: 11px; color: #b0b0c8; font-weight: 500; }
    .ci-count { font-size: 10px; color: #3a3a52; font-variant-numeric: tabular-nums; }

    /* ────────────────────────────────────────
       HUD: SELECTED BIRD DETAIL CARD
    ──────────────────────────────────────── */
    #detail-card {
      position: fixed;
      bottom: 68px;
      left: 16px;
      width: 196px;
      background: rgba(7,7,15,0.96);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px;
      padding: 10px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #detail-card.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    #dc-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 9px;
      display: block;
      margin-bottom: 8px;
      background: #111;
    }
    .dc-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 4px;
    }
    .dc-dot {
      width: 8px; height: 8px; border-radius: 2px;
      background: var(--clr, #CC785C); flex-shrink: 0;
    }
    #dc-species { font-size: 12px; font-weight: 700; color: #e8e8f0; }
    #dc-id      { font-size: 10px; color: #444; font-variant-numeric: tabular-nums; }
    #dc-hint    { font-size: 9px; color: #333; margin-top: 6px; padding-top: 6px;
                  border-top: 1px solid rgba(255,255,255,0.05); }

    #dc-close {
      position: absolute;
      top: 9px; right: 9px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      color: #555;
      font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    #dc-close:hover { background: rgba(255,255,255,0.13); color: #ccc; }

    /* ────────────────────────────────────────
       HUD: HOVER TOOLTIP
    ──────────────────────────────────────── */
    #tip {
      position: fixed;
      background: rgba(7,7,15,0.97);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: 8px;
      pointer-events: none;
      display: none;
      z-index: 70;
      width: 116px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #tip-img  { width: 100px; height: 100px; border-radius: 6px; display: block; object-fit: cover; margin-bottom: 6px; }
    #tip-name { font-size: 11px; font-weight: 700; color: #e8e8f0; display: block; }
    #tip-id   { font-size: 9px; color: #444; margin-top: 1px; display: block; font-variant-numeric: tabular-nums; }

    /* ────────────────────────────────────────
       HUD: HINT BAR
    ──────────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(7,7,15,0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.055);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 10px;
      color: #2e2e42;
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    /* ────────────────────────────────────────
       LOADING SCREEN
    ──────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      background: #07070f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #loading.gone { display: none; }
    .spin {
      width: 32px; height: 32px;
      border: 2px solid rgba(204,120,92,0.18);
      border-top-color: #CC785C;
      border-radius: 50%;
      animation: rot 0.85s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
    #ld-h { font-size: 14px; color: #CC785C; font-weight: 600; margin-bottom: 14px; letter-spacing: -0.01em; }
    .bar  { width: 240px; height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
    .bar-f{ height: 100%; background: linear-gradient(90deg, #CC785C, #e8936e); width: 0; transition: width 0.3s ease; border-radius: 2px; }
    #ld-s { font-size: 10px; color: #333; }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<!-- HUD: top bar -->
<div id="hud-top">
  <div class="logo">
    <div class="logo-mark">N</div>
    <div>
      <div class="logo-text">NestScope</div>
      <div class="logo-sub">Cluster Explorer</div>
    </div>
  </div>
  <div class="hud-sep"></div>
  <div class="hud-stat">
    <span class="hud-stat-v" id="stat-clusters">—</span>
    <span class="hud-stat-l">Clusters</span>
  </div>
  <div class="hud-stat">
    <span class="hud-stat-v" id="stat-birds">—</span>
    <span class="hud-stat-l">Birds</span>
  </div>
  <div class="hud-spacer"></div>
  <span id="hud-zoom">zoom ×—</span>
  <div class="hud-sep"></div>
  <div id="btn-panel" onclick="togglePanel()">
    <svg width="12" height="10" viewBox="0 0 12 10" fill="currentColor">
      <rect x="0" y="0" width="12" height="1.8" rx="0.9"/>
      <rect x="0" y="4.1" width="12" height="1.8" rx="0.9"/>
      <rect x="0" y="8.2" width="12" height="1.8" rx="0.9"/>
    </svg>
    Clusters
  </div>
  <a href="/" id="back-link">
    <svg width="8" height="12" viewBox="0 0 8 12" fill="currentColor" style="opacity:0.6">
      <path d="M7 1L2 6l5 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </svg>
    Back
  </a>
</div>

<!-- HUD: cluster panel -->
<div id="cluster-panel">
  <div class="cp-header">
    <div class="cp-title">Species Clusters</div>
    <div class="cp-count" id="cp-count">—</div>
  </div>
  <div id="cluster-list"></div>
</div>

<!-- Selected bird detail card -->
<div id="detail-card">
  <div id="dc-close" onclick="deselectBird()">✕</div>
  <img id="dc-img" alt="">
  <div class="dc-row">
    <div class="dc-dot" id="dc-dot"></div>
    <span id="dc-species">—</span>
  </div>
  <div id="dc-id">—</div>
  <div id="dc-hint">Click · center &nbsp; F · fit all</div>
</div>

<!-- Hover tooltip -->
<div id="tip">
  <img id="tip-img" alt="">
  <span id="tip-name"></span>
  <span id="tip-id"></span>
</div>

<!-- Hint bar -->
<div id="hint">Scroll · zoom &nbsp;·&nbsp; Drag · pan &nbsp;·&nbsp; Click · travel to bird &nbsp;·&nbsp; F · fit all</div>

<!-- Loading screen -->
<div id="loading">
  <div class="spin"></div>
  <div id="ld-h">Loading Cluster Explorer</div>
  <div class="bar"><div class="bar-f" id="bar-f"></div></div>
  <div id="ld-s">Initialising…</div>
</div>

<script>
/* ==============================================================
   NestScope Cluster Explorer — Canvas 2D  (no WebGL / Three.js)
   --------------------------------------------------------------
   OFFSCREEN LAYER  (built once at startup, ~40ms)
     ▸ Dark background
     ▸ Per-cluster convex-hull fill (8% opacity)  → territory
     ▸ Per-cluster convex-hull stroke (30% opacity) → boundary
     ▸ All 100K colored dots as placeholders for unloaded images

   This layer is displayed with a single ctx.drawImage() per frame.
   Panning and zooming cost exactly one GPU blit.

   DYNAMIC LAYER  (rendered only when dirty)
     ▸ Bird image thumbnails — always shown at ALL zoom levels
       10px tiles at overview → up to 90px at high zoom
       Lazy-loaded, LRU cache, priority-queued by screen distance
       Dots remain visible as placeholders until images load in
     ▸ Cluster name labels (fade in with zoom)
     ▸ Selected-bird dashed ring
     ▸ Hover ring
   ============================================================== */

// ── Config ────────────────────────────────────────────────────────
const C = {
  OFF_PX:            2400,   // offscreen canvas resolution (px)
  DOT_PX:            2,      // dot size on offscreen canvas (placeholder until image loads)

  // World-space image sizing
  // Images are sized as: imgPx = cam.zoom * WORLD_IMG_SIZE
  // WORLD_IMG_SIZE is computed at startup so images are exactly
  // WORLD_IMG_INIT_PX screen pixels at the initial fit-all zoom level.
  // This guarantees images NEVER overlap more than the data points do,
  // and scale continuously with zoom — no mode-switch jarring.
  WORLD_IMG_INIT_PX: 8,     // target screen size (px) at fit-all overview zoom
  IMG_ROUND_PX:      20,    // use rounded corners when imgPx > this
  IMG_PX_MAX:        110,   // max image screen size (px)

  MAX_DRAWS:         1200,  // max images drawn per frame
  MAX_QUEUE:         600,   // max pending HTTP load requests
  MAX_IMG_CACHE:     2500,  // LRU cache size
  MAX_LOADS:         20,    // parallel HTTP requests

  GRID:              50,    // spatial grid cells per axis
  ZOOM_MIN:          2,
  ZOOM_MAX:          700,
  WHEEL_K:           0.0020, // wheel zoom sensitivity (higher = faster)

  FLY_MS:            480,   // fly-to animation duration (ms)
  SEL_ZOOM:          55,    // target zoom when flying to a selected bird

  HULL_ALPHA_FILL:   0.08,  // cluster territory fill opacity
  HULL_ALPHA_LINE:   0.30,  // cluster territory border opacity

  // Inertia / momentum scrolling
  INERTIA_DECAY:     0.88,  // velocity multiplied by this per 16ms
  INERTIA_STOP:      0.0005,// stop inertia below this speed (world-units/ms)
};

// ── Canvas ────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d', { alpha: false });

// ── Data ──────────────────────────────────────────────────────────
let allPos       = null;   // Float32Array stride-4: [x, y, ci, id, ...]
let clusterXY    = [];     // Float32Array[] per cluster: [x0,y0, x1,y1, ...]
let clusterNames = [];
let clusterSizes = [];
let centroids    = [];     // [[tx,ty], ...]
let colorsHex    = [];
let hulls        = [];     // [[x,y], ...] per cluster (convex hull)
let total        = 0;

// ── Offscreen layer ───────────────────────────────────────────────
let offDots  = null;
let dataMinX = 0, dataMinY = 0, dataW = 1, dataH = 1;

// ── World-space image size (set after fitAll) ─────────────────────
// imgPx = cam.zoom * WORLD_IMG_SIZE  →  images scale with zoom, never overlap
let WORLD_IMG_SIZE = 1;

// ── Inertia state ────────────────────────────────────────────────
let vel       = { x: 0, y: 0 };  // world-units per ms
let inertiaId = null;
let lastPanT  = 0;
let lastPanX  = 0, lastPanY = 0;

// ── Spatial grid ──────────────────────────────────────────────────
let grid = [], gMinX = 0, gMinY = 0, gCellW = 1, gCellH = 1;
const G = C.GRID;

// ── Camera ────────────────────────────────────────────────────────
let cam = { x: 0, y: 0, zoom: 40 };

// ── Pan ───────────────────────────────────────────────────────────
let panning = false, panRef = null;

// ── Image loading ─────────────────────────────────────────────────
let imgCache = new Map();  // birdId → { img, seq } | 'loading' | 'error'
let imgQueue = new Map();  // birdId → dist²
let imgLoads = 0, lruSeq  = 0;

// ── RAF / dirty ───────────────────────────────────────────────────
let dirty = false, rafId = null;

// ── Hover ─────────────────────────────────────────────────────────
let hovId = -1, hovPosIdx = -1, hovTimer = null;

// ── Selection ─────────────────────────────────────────────────────
let selId = -1, selPosIdx = -1;

// ── Fly animation ─────────────────────────────────────────────────
let fly = null;  // { x0,y0,z0, x1,y1,z1, t0 }

// ── Panel visibility ─────────────────────────────────────────────
let panelOpen = true;

// ── Startup ───────────────────────────────────────────────────────
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); requestPaint(); });
bindEvents();
loadData();

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}


// ── Data loading ──────────────────────────────────────────────────
async function loadData() {
  prog(5, 'Fetching cluster data…');
  try {
    const res = await fetch('/api/cluster_positions');
    if (!res.ok) throw new Error('HTTP ' + res.status);

    prog(18, 'Parsing…');
    const d = await res.json();
    if (d.error) throw new Error(d.error);

    clusterNames = d.cluster_names;
    clusterSizes = d.cluster_sizes;
    centroids    = d.centroids;
    total        = d.total;
    colorsHex    = makeColors(clusterNames.length);

    prog(30, 'Building arrays…');
    await yld();
    buildArrays(d.positions);

    prog(40, 'Separating clusters…');
    await yld();
    separateClusters();

    prog(52, 'Computing cluster boundaries…');
    await yld();
    computeHulls();

    prog(56, 'Building spatial grid…');
    await yld();
    buildGrid();

    prog(70, 'Pre-rendering dot layer…');
    await yld();
    buildOffscreen();

    prog(86, 'Building UI…');
    buildSidebar();
    fitAll();
    // Set world-space image size so images are WORLD_IMG_INIT_PX pixels at this zoom.
    // As the user zooms in, images grow proportionally — they will never overlap
    // more than the underlying data points do.
    WORLD_IMG_SIZE = C.WORLD_IMG_INIT_PX / cam.zoom;

    document.getElementById('stat-clusters').textContent = clusterNames.length;
    document.getElementById('stat-birds').textContent    = total.toLocaleString();
    document.getElementById('cp-count').textContent      =
      `${clusterNames.length} clusters · ${total.toLocaleString()} birds`;

    prog(100, 'Ready');
    document.getElementById('loading').classList.add('gone');
    requestPaint();

  } catch (e) {
    console.error(e);
    document.getElementById('ld-s').textContent = 'Error: ' + e.message;
  }
}

function buildArrays(raw) {
  total  = raw.length;
  allPos = new Float32Array(total * 4);

  const counts = new Int32Array(clusterNames.length);
  for (let i = 0; i < total; i++) counts[raw[i][2]]++;

  clusterXY = clusterNames.map((_, ci) => new Float32Array(counts[ci] * 2));
  const offs = new Int32Array(clusterNames.length);

  for (let i = 0; i < total; i++) {
    const [x, y, ci, id] = raw[i];
    allPos[i*4] = x; allPos[i*4+1] = y; allPos[i*4+2] = ci; allPos[i*4+3] = id;
    const o = offs[ci];
    clusterXY[ci][o*2] = x; clusterXY[ci][o*2+1] = y;
    offs[ci]++;
  }
}


// ── Cluster separation ────────────────────────────────────────────
//
// Problem: raw t-SNE positions can scatter the same cluster across
// the whole map.  E.g. "LAGU" might appear on the left AND right
// side because k-means labels two separate visual groups the same
// species code.
//
// Fix (runs once at load, ~10 ms for 100K points):
//   1. Compute each cluster's actual centroid from data
//   2. Spread centroids outward 4× from the global center
//      → large inter-cluster gaps
//   3. For each cluster compute "allowed radius" =
//      44% of nearest-neighbor centroid distance
//      → guarantees a 12% gap ring around every cluster
//   4. Scale each cluster's points to fit within allowed radius
//      → any scatter / outlier points are pulled inward
//   5. Update centroids[] so labels are placed correctly
//
// Result: every cluster is a single tight island, physically
// separated from all neighbours, with clear dark space between them.
//
function separateClusters() {
  const NC = clusterNames.length;
  if (NC < 2) return;

  // Step 1: compute actual centroid of each cluster
  const ctrX = new Float64Array(NC);
  const ctrY = new Float64Array(NC);
  const cnt  = new Int32Array(NC);
  for (let i = 0; i < allPos.length; i += 4) {
    const ci = allPos[i+2] | 0;
    ctrX[ci] += allPos[i];
    ctrY[ci] += allPos[i+1];
    cnt[ci]++;
  }
  for (let ci = 0; ci < NC; ci++) {
    if (cnt[ci] > 0) { ctrX[ci] /= cnt[ci]; ctrY[ci] /= cnt[ci]; }
  }

  // Step 2: spread centroids outward from their global centre
  let gcx = 0, gcy = 0;
  for (let ci = 0; ci < NC; ci++) { gcx += ctrX[ci]; gcy += ctrY[ci]; }
  gcx /= NC; gcy /= NC;

  const SPREAD = 4.2;   // push clusters further apart
  const sCtrX = new Float64Array(NC);
  const sCtrY = new Float64Array(NC);
  for (let ci = 0; ci < NC; ci++) {
    sCtrX[ci] = gcx + (ctrX[ci] - gcx) * SPREAD;
    sCtrY[ci] = gcy + (ctrY[ci] - gcy) * SPREAD;
  }

  // Step 3: allowed radius = 44% of nearest-centroid distance
  //         (leaves a 12% gap ring between every pair of clusters)
  const allowedR = new Float64Array(NC).fill(1e9);
  for (let ci = 0; ci < NC; ci++) {
    for (let cj = 0; cj < NC; cj++) {
      if (ci === cj) continue;
      const dx   = sCtrX[ci] - sCtrX[cj];
      const dy   = sCtrY[ci] - sCtrY[cj];
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist * 0.44 < allowedR[ci]) allowedR[ci] = dist * 0.44;
    }
    if (allowedR[ci] === 1e9) allowedR[ci] = 10;
  }

  // Step 4: current maximum radius (point furthest from centroid)
  const actualR = new Float64Array(NC);
  for (let i = 0; i < allPos.length; i += 4) {
    const ci = allPos[i+2] | 0;
    const dx = allPos[i]   - ctrX[ci];
    const dy = allPos[i+1] - ctrY[ci];
    const r  = Math.sqrt(dx*dx + dy*dy);
    if (r > actualR[ci]) actualR[ci] = r;
  }

  // Step 5: remap all bird positions to new separated layout
  for (let i = 0; i < allPos.length; i += 4) {
    const ci    = allPos[i+2] | 0;
    const scale = actualR[ci] > 0.001 ? allowedR[ci] / actualR[ci] : 1;
    allPos[i]   = sCtrX[ci] + (allPos[i]   - ctrX[ci]) * scale;
    allPos[i+1] = sCtrY[ci] + (allPos[i+1] - ctrY[ci]) * scale;
  }

  // Step 6: remap clusterXY (used for hull drawing and offscreen rendering)
  for (let ci = 0; ci < NC; ci++) {
    const pts   = clusterXY[ci];
    const scale = actualR[ci] > 0.001 ? allowedR[ci] / actualR[ci] : 1;
    for (let j = 0; j < pts.length; j += 2) {
      pts[j]   = sCtrX[ci] + (pts[j]   - ctrX[ci]) * scale;
      pts[j+1] = sCtrY[ci] + (pts[j+1] - ctrY[ci]) * scale;
    }
  }

  // Step 7: update centroids for label placement
  for (let ci = 0; ci < NC; ci++) {
    centroids[ci] = [sCtrX[ci], sCtrY[ci]];
  }
}


// ── Convex hull (Andrew's monotone chain) ─────────────────────────
//
// We compute one hull per cluster so we can draw "territory" regions
// on the offscreen canvas.  For each cluster of ~2800 points this
// runs in < 1 ms.
//
function convexHull(flatXY) {
  const n = flatXY.length >> 1;
  if (n < 3) {
    const r = [];
    for (let i = 0; i < n; i++) r.push([flatXY[i*2], flatXY[i*2+1]]);
    return r;
  }

  // Build [x,y] pairs and sort lexicographically
  const pts = [];
  for (let i = 0; i < flatXY.length; i += 2) pts.push([flatXY[i], flatXY[i+1]]);
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);

  const cross = (O, A, B) =>
    (A[0] - O[0]) * (B[1] - O[1]) - (A[1] - O[1]) * (B[0] - O[0]);

  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0)
      lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0)
      upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

function computeHulls() {
  hulls = clusterXY.map(xy => convexHull(xy));
}


// ── Spatial grid ──────────────────────────────────────────────────
function buildGrid() {
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for (let i = 0; i < allPos.length; i += 4) {
    if (allPos[i]   < mnX) mnX = allPos[i];
    if (allPos[i]   > mxX) mxX = allPos[i];
    if (allPos[i+1] < mnY) mnY = allPos[i+1];
    if (allPos[i+1] > mxY) mxY = allPos[i+1];
  }
  const px = (mxX - mnX) * 0.01, py = (mxY - mnY) * 0.01;
  gMinX = mnX - px; gMinY = mnY - py;
  gCellW = (mxX - mnX + px*2) / G;
  gCellH = (mxY - mnY + py*2) / G;

  const cnt = new Int32Array(G * G);
  for (let i = 0; i < allPos.length; i += 4) {
    const c = clamp(((allPos[i]   - gMinX) / gCellW) | 0, 0, G-1);
    const r = clamp(((allPos[i+1] - gMinY) / gCellH) | 0, 0, G-1);
    cnt[r*G + c]++;
  }
  grid = [];
  const off = new Int32Array(G * G);
  for (let k = 0; k < G*G; k++) grid.push(new Int32Array(cnt[k]));
  for (let i = 0; i < allPos.length; i += 4) {
    const c = clamp(((allPos[i]   - gMinX) / gCellW) | 0, 0, G-1);
    const r = clamp(((allPos[i+1] - gMinY) / gCellH) | 0, 0, G-1);
    const k = r*G + c; grid[k][off[k]++] = i;
  }
}

// Returns allPos indices for points in the current viewport (with pixel expand)
function* visibleGrid(expandPx = 0) {
  const tl = s2w(-expandPx,              -expandPx);
  const br = s2w(canvas.width + expandPx, canvas.height + expandPx);
  const c0 = clamp(((tl.x - gMinX) / gCellW) | 0, 0, G-1);
  const c1 = clamp(((br.x - gMinX) / gCellW) | 0, 0, G-1);
  const r0 = clamp(((br.y - gMinY) / gCellH) | 0, 0, G-1); // y-flip
  const r1 = clamp(((tl.y - gMinY) / gCellH) | 0, 0, G-1);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const cell = grid[r*G + c];
    for (let j = 0; j < cell.length; j++) yield cell[j];
  }
}

function viewportCells(expandPx = 0) {
  const tl = s2w(-expandPx,              -expandPx);
  const br = s2w(canvas.width + expandPx, canvas.height + expandPx);
  return {
    c0: clamp(((tl.x - gMinX) / gCellW) | 0, 0, G-1),
    c1: clamp(((br.x - gMinX) / gCellW) | 0, 0, G-1),
    r0: clamp(((br.y - gMinY) / gCellH) | 0, 0, G-1),
    r1: clamp(((tl.y - gMinY) / gCellH) | 0, 0, G-1),
  };
}


// ── Offscreen canvas ──────────────────────────────────────────────
//
// We render three things here (ONCE, never again):
//   1. Dark background
//   2. Cluster territory regions (convex hull fill + stroke)
//   3. All 100 K bird dots (3×3 px colored squares)
//
// Displaying it every frame = 1 drawImage() call on the main canvas.
//
function buildOffscreen() {
  // Compute data bounding box (with padding)
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for (let i = 0; i < allPos.length; i += 4) {
    if (allPos[i]   < mnX) mnX = allPos[i];
    if (allPos[i]   > mxX) mxX = allPos[i];
    if (allPos[i+1] < mnY) mnY = allPos[i+1];
    if (allPos[i+1] > mxY) mxY = allPos[i+1];
  }
  const pad  = 0.04;
  dataMinX   = mnX - (mxX - mnX) * pad;
  dataMinY   = mnY - (mxY - mnY) * pad;
  dataW      = (mxX - mnX) * (1 + pad * 2);
  dataH      = (mxY - mnY) * (1 + pad * 2);

  const S = C.OFF_PX;
  offDots = (typeof OffscreenCanvas !== 'undefined')
    ? new OffscreenCanvas(S, S)
    : (() => { const cv = document.createElement('canvas'); cv.width = cv.height = S; return cv; })();
  const oc = offDots.getContext('2d');

  // World → offscreen pixel helpers
  const wx2px = wx => ((wx - dataMinX) / dataW) * S;
  const wy2py = wy => (1 - (wy - dataMinY) / dataH) * S;  // y-flip

  // 1. Background
  oc.fillStyle = '#07070f';
  oc.fillRect(0, 0, S, S);

  // 2. Cluster territories (hull fill then stroke)
  for (let ci = 0; ci < hulls.length; ci++) {
    const hull = hulls[ci];
    if (hull.length < 3) continue;
    oc.beginPath();
    oc.moveTo(wx2px(hull[0][0]), wy2py(hull[0][1]));
    for (let j = 1; j < hull.length; j++)
      oc.lineTo(wx2px(hull[j][0]), wy2py(hull[j][1]));
    oc.closePath();
    oc.globalAlpha = C.HULL_ALPHA_FILL;
    oc.fillStyle   = colorsHex[ci];
    oc.fill();
    oc.globalAlpha = C.HULL_ALPHA_LINE;
    oc.strokeStyle = colorsHex[ci];
    oc.lineWidth   = 2;
    oc.stroke();
  }
  oc.globalAlpha = 1;

  // 3. Dots — batched per cluster (one fillStyle change per cluster)
  const d = C.DOT_PX;
  for (let ci = 0; ci < clusterNames.length; ci++) {
    const pts = clusterXY[ci];
    oc.fillStyle = colorsHex[ci];
    for (let j = 0; j < pts.length; j += 2) {
      const ox = wx2px(pts[j]);
      const oy = wy2py(pts[j+1]);
      oc.fillRect(ox - d/2, oy - d/2, d, d);
    }
  }
}


// ── Camera helpers ────────────────────────────────────────────────
// World → screen  (zoom = screen px per world unit)
function w2s(wx, wy) {
  return [
    canvas.width  / 2 + (wx - cam.x) * cam.zoom,
    canvas.height / 2 - (wy - cam.y) * cam.zoom,
  ];
}
// Screen → world
function s2w(sx, sy) {
  return {
    x: cam.x + (sx - canvas.width  / 2) / cam.zoom,
    y: cam.y - (sy - canvas.height / 2) / cam.zoom,
  };
}

function fitAll() {
  const sbW    = panelOpen ? 234 : 0;
  const usableW = canvas.width - sbW;
  const zx = usableW         * 0.86 / dataW;
  const zy = canvas.height   * 0.86 / dataH;
  cam.zoom = Math.min(zx, zy);
  cam.x    = dataMinX + dataW / 2;
  cam.y    = dataMinY + dataH / 2;
  dirty    = true;
}


// ── Render loop ───────────────────────────────────────────────────
function requestPaint() {
  if (!dirty) dirty = true;
  if (!rafId)  rafId = requestAnimationFrame(paint);
}

function paint(now) {
  rafId = null;

  // Advance fly animation
  if (fly) {
    const t = Math.min((now - fly.t0) / C.FLY_MS, 1);
    const e = 1 - (1 - t) ** 3;  // cubic ease-out
    cam.x    = lerp(fly.x0, fly.x1, e);
    cam.y    = lerp(fly.y0, fly.y1, e);
    cam.zoom = lerp(fly.z0, fly.z1, e);
    if (t >= 1) fly = null;
    dirty = true;
  }

  if (!dirty) return;
  dirty = false;

  const W = canvas.width, H = canvas.height, z = cam.zoom;

  // ── 1. Clear + blit pre-rendered layer ────────────────────────
  // Clear first (covers area outside the data extent when fully zoomed out)
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, W, H);

  // Map visible world rect → offscreen source rect.
  // KEY: offscreen y is flipped (y increases downward), world y increases upward.
  // We must compute top/bottom separately so src_h is always positive.
  const S      = C.OFF_PX;
  const tl     = s2w(0, 0), br = s2w(W, H);
  const ox_l   = ((tl.x - dataMinX) / dataW) * S;
  const ox_r   = ((br.x - dataMinX) / dataW) * S;
  const oy_top = (1 - (tl.y - dataMinY) / dataH) * S;  // tl.y larger → smaller canvas y
  const oy_bot = (1 - (br.y - dataMinY) / dataH) * S;  // br.y smaller → larger canvas y
  const src_w  = ox_r - ox_l;   // always positive
  const src_h  = oy_bot - oy_top; // always positive
  if (src_w > 0 && src_h > 0) {
    ctx.drawImage(offDots, ox_l, oy_top, src_w, src_h, 0, 0, W, H);
  }

  // ── 2. Image thumbnails (always draw — dots are placeholders for unloaded images)
  drawImages(W, H, z);

  // ── 3. Cluster labels ────────────────────────────────────────
  drawLabels(W, H, z);

  // ── 4. Selection ring ────────────────────────────────────────
  if (selId >= 0 && selPosIdx >= 0) drawSelRing(z);

  // ── 5. Hover ring ────────────────────────────────────────────
  if (hovId >= 0 && hovPosIdx >= 0) drawHovRing(z);

  // ── 6. Update zoom display ────────────────────────────────────
  document.getElementById('hud-zoom').textContent = `zoom ×${Math.round(z)}`;

  // ── 7. Keep fly RAF alive ────────────────────────────────────
  if (fly) rafId = requestAnimationFrame(paint);
}


// ── Image rendering ───────────────────────────────────────────────
//
// World-space sizing: imgPx = cam.zoom × WORLD_IMG_SIZE
// WORLD_IMG_SIZE was calibrated at startup so images are WORLD_IMG_INIT_PX
// screen pixels at the overview zoom, and scale linearly as you zoom in.
// This means images NEVER overlap more than the data points do — same
// behaviour as the Google t-SNE embedding viewer.
//
function drawImages(W, H, z) {
  const imgPx  = Math.min(z * WORLD_IMG_SIZE, C.IMG_PX_MAX);
  if (imgPx < 2) return;   // sub-pixel, nothing to draw
  const half   = imgPx / 2;
  const doRnd  = imgPx > C.IMG_ROUND_PX;
  const rad    = doRnd ? Math.max(2, imgPx * 0.12) : 0;
  const bw     = Math.max(1, imgPx * 0.035);

  const ox  = W / 2 - cam.x * z;
  const oy  = H / 2 + cam.y * z;
  const cxS = W / 2, cyS = H / 2;
  let drawn = 0;

  for (const pi of visibleGrid(half)) {
    const wx = allPos[pi], wy = allPos[pi+1];
    const ci = allPos[pi+2] | 0, id = allPos[pi+3] | 0;
    const sx = ox + wx * z, sy = oy - wy * z;
    if (sx + half < 0 || sx - half > W || sy + half < 0 || sy - half > H) continue;

    const x     = sx - half, y = sy - half;
    const entry = imgCache.get(id);

    if (entry && entry !== 'loading' && entry !== 'error') {
      if (doRnd) {
        // Larger images: rounded clip + colored border
        ctx.save();
        ctx.beginPath(); rrect(ctx, x, y, imgPx, imgPx, rad); ctx.clip();
        ctx.drawImage(entry.img, x, y, imgPx, imgPx);
        ctx.restore();
        ctx.strokeStyle = colorsHex[ci];
        ctx.lineWidth   = bw;
        ctx.beginPath(); rrect(ctx, x, y, imgPx, imgPx, rad); ctx.stroke();
      } else {
        // Small tiles: plain rect draw (no clip saves a lot of time)
        ctx.drawImage(entry.img, x, y, imgPx, imgPx);
        if (imgPx > 5) {
          ctx.strokeStyle = colorsHex[ci];
          ctx.lineWidth   = 1;
          ctx.strokeRect(x + 0.5, y + 0.5, imgPx - 1, imgPx - 1);
        }
      }
      entry.seq = ++lruSeq;
      drawn++;
      if (drawn >= C.MAX_DRAWS) break;
    } else if (!entry || entry === 'error') {
      // Not loaded yet — queue it (sorted by screen distance in pumpQueue)
      if (imgQueue.size < C.MAX_QUEUE) {
        const d2 = (sx - cxS) ** 2 + (sy - cyS) ** 2;
        if (!imgQueue.has(id)) imgQueue.set(id, d2);
      }
    }
  }
  pumpQueue();
}

function pumpQueue() {
  if (imgQueue.size === 0 || imgLoads >= C.MAX_LOADS) return;
  const sorted = [...imgQueue.entries()].sort((a, b) => a[1] - b[1]);
  for (const [id] of sorted) {
    if (imgLoads >= C.MAX_LOADS) break;
    if (imgCache.has(id)) { imgQueue.delete(id); continue; }
    imgQueue.delete(id);
    imgLoads++;
    imgCache.set(id, 'loading');
    const img = new Image();
    img.onload = () => {
      imgCache.set(id, { img, seq: ++lruSeq });
      imgLoads--;
      evict();
      requestPaint();
      pumpQueue();
    };
    img.onerror = () => { imgCache.set(id, 'error'); imgLoads--; pumpQueue(); };
    img.src = `/api/bird_crop/${id}`;
  }
}

function evict() {
  if (imgCache.size <= C.MAX_IMG_CACHE) return;
  const loaded = [...imgCache.entries()]
    .filter(([, v]) => v !== 'loading' && v !== 'error')
    .sort((a, b) => a[1].seq - b[1].seq);
  const need = imgCache.size - C.MAX_IMG_CACHE;
  for (let i = 0; i < need && i < loaded.length; i++)
    imgCache.delete(loaded[i][0]);
}


// ── Cluster labels ────────────────────────────────────────────────
function drawLabels(W, H, z) {
  const alpha = smoothstep(4, 12, z);
  if (alpha < 0.02) return;
  ctx.globalAlpha = alpha;

  const fs = clamp(z * 0.85, 9, 15);
  ctx.font         = `700 ${fs}px -apple-system, sans-serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';

  for (let ci = 0; ci < centroids.length; ci++) {
    const [tx, ty] = centroids[ci];
    const [sx, sy] = w2s(tx, ty);
    if (sx < -80 || sx > W+80 || sy < -24 || sy > H+24) continue;

    const name = clusterNames[ci];
    const tw   = ctx.measureText(name).width;
    const th   = fs * 1.3;
    const pad  = 5;

    ctx.fillStyle = 'rgba(7,7,15,0.82)';
    ctx.beginPath();
    rrect(ctx, sx - tw/2 - pad, sy - th/2 - pad/2, tw + pad*2, th + pad, (th + pad) / 2);
    ctx.fill();

    ctx.fillStyle = colorsHex[ci];
    ctx.fillText(name, sx, sy);
  }

  ctx.globalAlpha  = 1;
  ctx.textAlign    = 'left';
  ctx.textBaseline = 'alphabetic';
}


// ── Selection ring ────────────────────────────────────────────────
function drawSelRing(z) {
  if (selPosIdx < 0) return;
  const [sx, sy] = w2s(allPos[selPosIdx], allPos[selPosIdx+1]);
  const ci    = allPos[selPosIdx+2] | 0;
  const imgPx = Math.min(z * WORLD_IMG_SIZE, C.IMG_PX_MAX);
  const r     = imgPx / 2 + Math.max(4, imgPx * 0.12);

  ctx.strokeStyle = colorsHex[ci];
  ctx.lineWidth   = 2;
  ctx.setLineDash([5, 3]);
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth   = 1;
  ctx.beginPath(); ctx.arc(sx, sy, r + 3, 0, Math.PI * 2); ctx.stroke();
}


// ── Hover ring ────────────────────────────────────────────────────
function drawHovRing(z) {
  const [sx, sy] = w2s(allPos[hovPosIdx], allPos[hovPosIdx+1]);
  const imgPx = Math.min(z * WORLD_IMG_SIZE, C.IMG_PX_MAX);
  const r     = imgPx / 2 + Math.max(3, imgPx * 0.10);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth   = 1.5;
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI * 2); ctx.stroke();
}


// ── Events ────────────────────────────────────────────────────────
function bindEvents() {
  canvas.addEventListener('mousedown',  onDown);
  canvas.addEventListener('mousemove',  onMove);
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onLeave);
  canvas.addEventListener('wheel',      onWheel, { passive: false });
  window.addEventListener('keydown',    onKey);
  document.getElementById('dc-close').addEventListener('click', deselectBird);
}

function onDown(e) {
  if (e.button !== 0) return;
  // Kill any ongoing inertia when the user grabs the canvas
  if (inertiaId) { cancelAnimationFrame(inertiaId); inertiaId = null; }
  vel.x = 0; vel.y = 0;
  panning  = true;
  canvas.classList.add('panning');
  panRef   = { mx: e.clientX, my: e.clientY, cx: cam.x, cy: cam.y, moved: false };
  lastPanT = performance.now();
  lastPanX = e.clientX; lastPanY = e.clientY;
  hideTooltip();
}

function onMove(e) {
  if (panning) {
    const dx = e.clientX - panRef.mx, dy = e.clientY - panRef.my;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) panRef.moved = true;
    cam.x = panRef.cx - dx / cam.zoom;
    cam.y = panRef.cy + dy / cam.zoom;

    // Track instantaneous velocity for inertia on release
    const now = performance.now(), dt = now - lastPanT;
    if (dt > 0) {
      vel.x = -(e.clientX - lastPanX) / cam.zoom / dt;
      vel.y =  (e.clientY - lastPanY) / cam.zoom / dt;
    }
    lastPanT = now; lastPanX = e.clientX; lastPanY = e.clientY;

    requestPaint();
    return;
  }
  clearTimeout(hovTimer);
  hovTimer = setTimeout(() => detectHover(e.clientX, e.clientY), 28);
}

function onUp(e) {
  if (panning && !panRef.moved) {
    // Clean click (no drag) → select bird and fly to it
    selectBird(e.clientX, e.clientY);
  } else if (panning && panRef.moved) {
    // Release with velocity → coast with inertia
    const speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y);
    if (speed > C.INERTIA_STOP) startInertia();
  }
  panning = false;
  canvas.classList.remove('panning');
  panRef  = null;
}

function onLeave() {
  if (panning && panRef && panRef.moved) {
    const speed = Math.sqrt(vel.x * vel.x + vel.y * vel.y);
    if (speed > C.INERTIA_STOP) startInertia();
  }
  panning = false;
  canvas.classList.remove('panning');
  panRef  = null;
}

// ── Inertia / momentum scrolling ─────────────────────────────────
//
// When the user releases a drag with velocity, the camera coasts and
// decelerates smoothly — the same "floaty" feel as Google Maps.
//
// vel is in world-units per millisecond.
// Each RAF step applies the velocity then multiplies it by INERTIA_DECAY^(dt/16).
//
function startInertia() {
  if (inertiaId) cancelAnimationFrame(inertiaId);
  let prevT = performance.now();
  const step = (now) => {
    const dt = Math.min(now - prevT, 64); // cap at 64ms (handles tab background)
    prevT = now;
    const decay = Math.pow(C.INERTIA_DECAY, dt / 16);
    vel.x *= decay;
    vel.y *= decay;
    cam.x += vel.x * dt;
    cam.y += vel.y * dt;
    requestPaint();
    if (Math.sqrt(vel.x * vel.x + vel.y * vel.y) > C.INERTIA_STOP) {
      inertiaId = requestAnimationFrame(step);
    } else {
      inertiaId = null;
    }
  };
  inertiaId = requestAnimationFrame(step);
}

function onWheel(e) {
  e.preventDefault();
  const factor  = Math.exp(-e.deltaY * C.WHEEL_K);
  const newZoom = clamp(cam.zoom * factor, C.ZOOM_MIN, C.ZOOM_MAX);
  const wx = cam.x + (e.clientX - canvas.width  / 2) / cam.zoom;
  const wy = cam.y - (e.clientY - canvas.height / 2) / cam.zoom;
  cam.zoom = newZoom;
  cam.x    = wx - (e.clientX - canvas.width  / 2) / newZoom;
  cam.y    = wy + (e.clientY - canvas.height / 2) / newZoom;
  imgQueue.clear();
  requestPaint();
}

function onKey(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'f' || e.key === 'F') { fitAll(); requestPaint(); }
  if (e.key === 'Escape') deselectBird();
}


// ── Hover detection ───────────────────────────────────────────────
function detectHover(mx, my) {
  if (!allPos) return;
  const wx = cam.x + (mx - canvas.width  / 2) / cam.zoom;
  const wy = cam.y - (my - canvas.height / 2) / cam.zoom;
  const rW  = 14 / cam.zoom, rW2 = rW * rW;

  const mc = clamp(((wx - gMinX) / gCellW) | 0, 0, G-1);
  const mr = clamp(((wy - gMinY) / gCellH) | 0, 0, G-1);

  let best2 = rW2, bestId = -1, bestIdx = -1;
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    const r = mr + dr, c = mc + dc;
    if (r < 0 || r >= G || c < 0 || c >= G) continue;
    const cell = grid[r*G + c];
    for (let j = 0; j < cell.length; j++) {
      const i  = cell[j];
      const dx = allPos[i] - wx, dy = allPos[i+1] - wy;
      const d2 = dx*dx + dy*dy;
      if (d2 < best2) { best2 = d2; bestId = allPos[i+3]|0; bestIdx = i; }
    }
  }

  if (bestId >= 0 && bestId !== hovId) {
    hovId = bestId; hovPosIdx = bestIdx;
    showTooltip(mx, my, bestId, allPos[bestIdx+2]|0);
    requestPaint();
  } else if (bestId < 0 && hovId >= 0) {
    hovId = -1; hovPosIdx = -1;
    hideTooltip();
    requestPaint();
  }
}

function showTooltip(mx, my, id, ci) {
  const tip = document.getElementById('tip');
  document.getElementById('tip-img').src             = `/api/bird_crop/${id}`;
  document.getElementById('tip-name').textContent    = clusterNames[ci] || '?';
  document.getElementById('tip-id').textContent      = `Bird #${id}`;
  const TW = 130, TH = 148;
  let tx = mx + 16, ty = my - 16;
  if (tx + TW > canvas.width  - (panelOpen ? 244 : 10)) tx = mx - TW - 16;
  if (ty + TH > canvas.height - 10) ty = my - TH;
  tip.style.left    = tx + 'px';
  tip.style.top     = ty + 'px';
  tip.style.display = 'block';
}

function hideTooltip() {
  document.getElementById('tip').style.display = 'none';
}


// ── Bird selection + travel ────────────────────────────────────────
//
// Click on a bird to:
//   1. Fly the camera to centre on it (smooth 600ms animation)
//   2. Show the detail card (bottom-left) with image + species
//   3. Draw a dashed selection ring on canvas
//
function selectBird(mx, my) {
  if (!allPos) return;
  const wx = cam.x + (mx - canvas.width  / 2) / cam.zoom;
  const wy = cam.y - (my - canvas.height / 2) / cam.zoom;
  const rW  = 22 / cam.zoom, rW2 = rW * rW;

  const mc = clamp(((wx - gMinX) / gCellW) | 0, 0, G-1);
  const mr = clamp(((wy - gMinY) / gCellH) | 0, 0, G-1);

  let best2 = rW2, bestId = -1, bestIdx = -1;
  for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
    const r = mr + dr, c = mc + dc;
    if (r < 0 || r >= G || c < 0 || c >= G) continue;
    const cell = grid[r*G + c];
    for (let j = 0; j < cell.length; j++) {
      const i  = cell[j];
      const dx = allPos[i] - wx, dy = allPos[i+1] - wy;
      const d2 = dx*dx + dy*dy;
      if (d2 < best2) { best2 = d2; bestId = allPos[i+3]|0; bestIdx = i; }
    }
  }

  if (bestId < 0) return;

  selId     = bestId;
  selPosIdx = bestIdx;
  const ci  = allPos[bestIdx+2] | 0;

  // Fly to it — if already close enough in zoom, keep current zoom
  const targetZoom = Math.max(cam.zoom, C.SEL_ZOOM);
  fly = {
    x0: cam.x, y0: cam.y, z0: cam.zoom,
    x1: allPos[bestIdx], y1: allPos[bestIdx+1], z1: targetZoom,
    t0: performance.now()
  };

  showDetailCard(bestId, ci);
  requestPaint();

  // Highlight in sidebar
  document.querySelectorAll('.ci').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.ci[data-ci="${ci}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
}

function deselectBird() {
  if (selId < 0) return;
  selId = -1; selPosIdx = -1;
  document.getElementById('detail-card').classList.remove('visible');
  requestPaint();
}

function showDetailCard(id, ci) {
  const card = document.getElementById('detail-card');
  document.getElementById('dc-img').src      = `/api/bird_crop/${id}`;
  document.getElementById('dc-species').textContent = clusterNames[ci] || 'Unknown';
  document.getElementById('dc-id').textContent      = `Bird ID #${id}`;
  const dot = document.getElementById('dc-dot');
  dot.style.setProperty('--clr', colorsHex[ci]);
  dot.style.background = colorsHex[ci];
  card.classList.add('visible');
}


// ── Sidebar ───────────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('cluster-list');
  list.innerHTML = '';
  clusterNames.forEach((name, ci) => {
    const el  = document.createElement('div');
    el.className = 'ci';
    el.dataset.ci = ci;
    el.style.setProperty('--clr', colorsHex[ci]);
    el.innerHTML = `
      <span class="ci-swatch"></span>
      <span class="ci-name">${name}</span>
      <span class="ci-count">${clusterSizes[ci].toLocaleString()}</span>`;
    el.addEventListener('click', () => {
      document.querySelectorAll('.ci').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      flyToCluster(ci);
    });
    list.appendChild(el);
  });
}

function flyToCluster(ci) {
  const [tx, ty] = centroids[ci];
  // Compute zoom to fit the cluster
  const pts = clusterXY[ci];
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for (let j = 0; j < pts.length; j += 2) {
    if (pts[j]   < mnX) mnX = pts[j];
    if (pts[j]   > mxX) mxX = pts[j];
    if (pts[j+1] < mnY) mnY = pts[j+1];
    if (pts[j+1] > mxY) mxY = pts[j+1];
  }
  const dW = Math.max(0.1, mxX - mnX), dH = Math.max(0.1, mxY - mnY);
  const sbW = panelOpen ? 240 : 0;
  const zx  = (canvas.width - sbW) * 0.72 / dW;
  const zy  = canvas.height        * 0.72 / dH;
  const newZoom = Math.min(zx, zy, 280);
  fly = { x0: cam.x, y0: cam.y, z0: cam.zoom, x1: tx, y1: ty, z1: newZoom, t0: performance.now() };
  requestPaint();
}

function togglePanel() {
  panelOpen = !panelOpen;
  const panel = document.getElementById('cluster-panel');
  const btn   = document.getElementById('btn-panel');
  if (panelOpen) {
    panel.classList.remove('hidden');
    btn.classList.add('active');
  } else {
    panel.classList.add('hidden');
    btn.classList.remove('active');
  }
}


// ── Utilities ─────────────────────────────────────────────────────
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t)    { return a + (b - a) * t; }
function smoothstep(lo, hi, x) {
  const t = clamp((x - lo) / (hi - lo), 0, 1);
  return t * t * (3 - 2 * t);
}
function yld() { return new Promise(r => setTimeout(r, 0)); }
function prog(pct, msg) {
  document.getElementById('bar-f').style.width = pct + '%';
  document.getElementById('ld-s').textContent  = msg;
}

// Rounded rectangle path helper (polyfill for browsers without roundRect)
function rrect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x,     y + r); ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

// Perceptually distinct colour palette
function makeColors(n) {
  return Array.from({ length: n }, (_, i) => {
    const h = (i * 360 / n + 12) % 360;
    const s = 65 + (i % 4) * 5;
    const l = 55 + (i % 3) * 7;
    return hsl2hex(h, s, l);
  });
}
function hsl2hex(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h / 30) % 12;
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
  };
  return `#${f(0).toString(16).padStart(2,'0')}${f(8).toString(16).padStart(2,'0')}${f(4).toString(16).padStart(2,'0')}`;
}
