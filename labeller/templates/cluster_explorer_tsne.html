<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NestScope — Cluster Explorer 3D</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #07070f;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Full-viewport canvas (injected by Three.js renderer) ── */
    #c {
      display: block;
      position: fixed;
      inset: 0;
      cursor: grab;
    }

    /* ────────────────────────────────────────
       HUD: TOP BAR
    ──────────────────────────────────────── */
    #hud-top {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: rgba(7,7,15,0.88);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      border-bottom: 1px solid rgba(255,255,255,0.055);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 14px;
      z-index: 50;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .logo-mark {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, #CC785C 0%, #e8936e 100%);
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(204,120,92,0.35);
    }
    .logo-text {
      font-size: 13px;
      font-weight: 700;
      color: #e8e8f0;
      letter-spacing: -0.01em;
    }
    .logo-sub {
      font-size: 10px;
      color: #444;
      font-weight: 500;
    }

    .hud-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.07); flex-shrink: 0; }

    .hud-stat {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 48px;
    }
    .hud-stat-v {
      font-size: 12px;
      font-weight: 700;
      color: #CC785C;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .hud-stat-l {
      font-size: 9px;
      color: #3a3a52;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #hud-zoom {
      font-size: 10px;
      color: #3a3a52;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      min-width: 56px;
      text-align: right;
    }

    .hud-spacer { flex: 1; }

    /* ── HUD: cluster panel toggle ── */
    #btn-panel {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 12px;
      background: rgba(204,120,92,0.10);
      border: 1px solid rgba(204,120,92,0.20);
      border-radius: 7px;
      color: #CC785C;
      font-size: 11px; font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    #btn-panel:hover { background: rgba(204,120,92,0.18); border-color: rgba(204,120,92,0.35); }
    #btn-panel.active { background: rgba(204,120,92,0.22); }

    /* ── Back link ── */
    #back-link {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 7px;
      color: #555;
      font-size: 11px;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #back-link:hover { background: rgba(255,255,255,0.08); color: #999; }

    /* ────────────────────────────────────────
       HUD: CLUSTER PANEL (right slide-over)
    ──────────────────────────────────────── */
    #cluster-panel {
      position: fixed;
      top: 48px; right: 0;
      width: 234px;
      height: calc(100vh - 48px);
      background: rgba(7,7,15,0.92);
      backdrop-filter: blur(22px) saturate(1.4);
      -webkit-backdrop-filter: blur(22px) saturate(1.4);
      border-left: 1px solid rgba(255,255,255,0.055);
      display: flex;
      flex-direction: column;
      z-index: 40;
      transform: translateX(0);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    #cluster-panel.hidden { transform: translateX(100%); }

    .cp-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .cp-title {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #3a3a52;
    }
    .cp-count {
      font-size: 11px;
      color: #555;
      margin-top: 3px;
    }

    #cluster-list {
      flex: 1;
      overflow-y: auto;
      padding: 5px 0;
      scrollbar-width: thin;
      scrollbar-color: #1e1e2e transparent;
    }
    #cluster-list::-webkit-scrollbar { width: 3px; }
    #cluster-list::-webkit-scrollbar-thumb { background: #1e1e2e; border-radius: 2px; }

    .ci {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.1s;
      border-left: 2px solid transparent;
      border-right: 2px solid transparent;
    }
    .ci:hover  { background: rgba(255,255,255,0.04); }
    .ci.active {
      background: rgba(204,120,92,0.09);
      border-left-color: var(--clr);
    }
    .ci-swatch {
      width: 10px; height: 10px;
      border-radius: 3px;
      background: var(--clr);
      flex-shrink: 0;
      box-shadow: 0 0 4px color-mix(in srgb, var(--clr) 40%, transparent);
    }
    .ci-name  { flex: 1; font-size: 11px; color: #b0b0c8; font-weight: 500; }
    .ci-count { font-size: 10px; color: #3a3a52; font-variant-numeric: tabular-nums; }

    /* ────────────────────────────────────────
       HUD: SELECTED BIRD DETAIL CARD
    ──────────────────────────────────────── */
    #detail-card {
      position: fixed;
      bottom: 68px;
      left: 16px;
      width: 196px;
      background: rgba(7,7,15,0.96);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px;
      padding: 10px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    #detail-card.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    #dc-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 9px;
      display: block;
      margin-bottom: 8px;
      background: #111;
    }
    .dc-row {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 4px;
    }
    .dc-dot {
      width: 8px; height: 8px; border-radius: 2px;
      background: var(--clr, #CC785C); flex-shrink: 0;
    }
    #dc-species { font-size: 12px; font-weight: 700; color: #e8e8f0; }
    #dc-id      { font-size: 10px; color: #444; font-variant-numeric: tabular-nums; }
    #dc-hint    { font-size: 9px; color: #333; margin-top: 6px; padding-top: 6px;
                  border-top: 1px solid rgba(255,255,255,0.05); }

    #dc-close {
      position: absolute;
      top: 9px; right: 9px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      color: #555;
      font-size: 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }
    #dc-close:hover { background: rgba(255,255,255,0.13); color: #ccc; }

    /* ────────────────────────────────────────
       HUD: HOVER TOOLTIP
    ──────────────────────────────────────── */
    #tip {
      position: fixed;
      background: rgba(7,7,15,0.97);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 10px;
      padding: 8px;
      pointer-events: none;
      display: none;
      z-index: 70;
      width: 116px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #tip-img  { width: 100px; height: 100px; border-radius: 6px; display: block; object-fit: cover; margin-bottom: 6px; }
    #tip-name { font-size: 11px; font-weight: 700; color: #e8e8f0; display: block; }
    #tip-id   { font-size: 9px; color: #444; margin-top: 1px; display: block; font-variant-numeric: tabular-nums; }

    /* ────────────────────────────────────────
       HUD: HINT BAR
    ──────────────────────────────────────── */
    #hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(7,7,15,0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.055);
      border-radius: 20px;
      padding: 5px 16px;
      font-size: 10px;
      color: #2e2e42;
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      letter-spacing: 0.02em;
    }

    /* ────────────────────────────────────────
       LOADING SCREEN
    ──────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      background: #07070f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #loading.gone { display: none; }
    .spin {
      width: 32px; height: 32px;
      border: 2px solid rgba(204,120,92,0.18);
      border-top-color: #CC785C;
      border-radius: 50%;
      animation: rot 0.85s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
    #ld-h { font-size: 14px; color: #CC785C; font-weight: 600; margin-bottom: 14px; letter-spacing: -0.01em; }
    .bar  { width: 240px; height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
    .bar-f{ height: 100%; background: linear-gradient(90deg, #CC785C, #e8936e); width: 0; transition: width 0.3s ease; border-radius: 2px; }
    #ld-s { font-size: 10px; color: #333; }
  </style>
</head>
<body>

<!-- Three.js injects its canvas before these elements -->

<!-- HUD: top bar -->
<div id="hud-top">
  <div class="logo">
    <div class="logo-mark">N</div>

      <div class="logo-text">NestScope</div>

  </div>

    <svg width="8" height="12" viewBox="0 0 8 12" fill="currentColor" style="opacity:0.6">

</div>

<!-- HUD: cluster panel -->
<div id="cluster-panel">
  <div class="cp-header">

</div>

<!-- Selected bird detail card -->
<div id="detail-card">

</div>

<!-- Hover tooltip -->

</div>

<!-- Hint bar -->
<div id="hint">Left drag · orbit &nbsp;·&nbsp; Right drag · pan &nbsp;·&nbsp; Scroll · zoom &nbsp;·&nbsp; Click · select bird &nbsp;·&nbsp; F · fit all</div>

<!-- Loading screen -->
<div id="loading">
  <div class="spin"></div>
  <div id="ld-h">Loading Cluster Explorer</div>
  <div class="bar"><div class="bar-f" id="bar-f"></div></div>
  <div id="ld-s">Initialising…</div>
</div>

<!-- Three.js via importmap (ES module, works in all modern browsers) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ==============================================================
   NestScope Cluster Explorer — Three.js 3D
   --------------------------------------------------------------
   ARCHITECTURE:
     THREE.Points  (1 draw call)     → all 100 K birds as colored dots
     THREE.Sprite pool (≤800)        → lazy-loaded image thumbnails
     Flat hull meshes at Z = 0       → cluster territory regions
     Overlay <canvas> for labels     → cluster name text

   LOADING (identical pipeline to the 2D canvas version):
     imgCache  LRU Map     (birdId → { texture, seq } | 'loading' | 'error')
     imgQueue  priority Map (birdId → screenDist²)
     MAX_LOADS parallel TextureLoader requests

   3D DEPTH:
     Each bird gets a deterministic Z based on its ID:
       Z = sin(id * large_prime) * Z_AMPLITUDE
     This spreads birds within each cluster into depth so that
     orbiting sideways reveals images that are hidden from above.
   ============================================================== */

// ── Config ────────────────────────────────────────────────────────
const C = {
  Z_SPREAD:       0.18,    // Z amplitude as fraction of max(dataW, dataH)
  SPRITE_INIT_PX: 14,      // target sprite screen size (px) at fit-all zoom
  IMG_PX_MAX:     100,     // max sprite visual size on screen (soft cap)

  MAX_SPRITES:    800,     // sprite pool size (= max images drawn at once)
  MAX_QUEUE:      600,     // max pending load requests queued
  MAX_IMG_CACHE:  2500,    // LRU texture cache size
  MAX_LOADS:      20,      // parallel HTTP requests

  GRID:           50,      // spatial grid cells per axis (XY)
  FLY_MS:         500,     // fly-to animation duration ms

  HULL_ALPHA_FILL: 0.07,
  HULL_ALPHA_LINE: 0.28,
};

// ── Scene ─────────────────────────────────────────────────────────
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x07070f);

const camera   = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 5000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

// Insert canvas as first child so HUD elements sit on top
const canvasEl = renderer.domElement;
canvasEl.id = 'c';
document.body.insertBefore(canvasEl, document.body.firstChild);

// ── Orbit Controls ────────────────────────────────────────────────
const controls = new OrbitControls(camera, canvasEl);
controls.enableDamping  = true;
controls.dampingFactor  = 0.07;
controls.rotateSpeed    = 0.7;
controls.zoomSpeed      = 1.2;
controls.panSpeed       = 0.8;
controls.minDistance    = 0.5;
controls.maxDistance    = 1000;
controls.mouseButtons   = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };

// ── Label overlay canvas (for cluster name text drawn over scene) ─
const lblCanvas = document.createElement('canvas');
lblCanvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:4;';
lblCanvas.width = innerWidth; lblCanvas.height = innerHeight;
// Insert after the Three.js canvas, before HUD
canvasEl.insertAdjacentElement('afterend', lblCanvas);
const lctx = lblCanvas.getContext('2d');

// ── Data ──────────────────────────────────────────────────────────
let allPos       = null;   // Float32Array stride-4: [x, y, ci, id, ...]
let allZ         = null;   // Float32Array: Z per bird  (index = posIdx >> 2)
let clusterXY    = [];
let clusterNames = [];
let clusterSizes = [];
let centroids    = [];
let colorsHex    = [];
let hulls        = [];
let total        = 0;
let dataMinX = 0, dataMinY = 0, dataW = 1, dataH = 1;

// ── Three.js objects ──────────────────────────────────────────────
let pointsObj = null;                 // THREE.Points for all birds

// Sprite pool — pre-created and reused to avoid GC pressure
const pool       = [];                // THREE.Sprite[]
const birdSprite = new Map();         // birdId → sprite (currently visible)
let   spriteSeq  = 0;                 // LRU counter for pool eviction

// ── Image loading (same pipeline as the 2D canvas version) ────────
const texLoader  = new THREE.TextureLoader();
let imgCache = new Map();  // birdId → { texture, seq } | 'loading' | 'error'
let imgQueue = new Map();  // birdId → dist² (priority — smaller = load first)
let imgLoads = 0, lruSeq = 0;

// ── World-space sprite size (calibrated after fitAll) ─────────────
let SPRITE_WORLD = 1;

// ── Spatial grid (XY plane) ───────────────────────────────────────
let grid = [], gMinX = 0, gMinY = 0, gCellW = 1, gCellH = 1;
const G = C.GRID;

// ── Selection / hover ─────────────────────────────────────────────
let selId = -1, selPosIdx = -1;
let hovId = -1, hovPosIdx = -1, hovTimer = null;

// ── Fly animation ─────────────────────────────────────────────────
let fly = null; // { pos0, pos1, tgt0, tgt1, t0 }

// ── Panel state ───────────────────────────────────────────────────
let panelOpen = true;

// ── Click vs drag discrimination ──────────────────────────────────
const raycaster = new THREE.Raycaster();
let mouseDownXY = null, wasDrag = false;

// ── Init ──────────────────────────────────────────────────────────
window.addEventListener('resize', onResize);
bindEvents();
loadData();

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  lblCanvas.width = innerWidth; lblCanvas.height = innerHeight;
}

// Expose to HTML onclick attributes (modules don't auto-expose globals)
window.togglePanel  = togglePanel;
window.deselectBird = deselectBird;


// ── Data loading ──────────────────────────────────────────────────
async function loadData() {
  prog(5, 'Fetching cluster data…');
  try {
    const res = await fetch('/api/cluster_positions');
    if (!res.ok) throw new Error('HTTP ' + res.status);

    prog(18, 'Parsing…');
    const d = await res.json();
    if (d.error) throw new Error(d.error);

    clusterNames = d.cluster_names;
    clusterSizes = d.cluster_sizes;
    centroids    = d.centroids;
    total        = d.total;
    colorsHex    = makeColors(clusterNames.length);

    prog(30, 'Building arrays…');
    await yld();
    buildArrays(d.positions);

    prog(40, 'Separating clusters…');
    await yld();
    separateClusters();

    prog(52, 'Computing cluster boundaries…');
    await yld();
    computeHulls();

    prog(58, 'Building spatial grid…');
    await yld();
    buildGrid();

    prog(66, 'Assigning depth…');
    await yld();
    assignZ();

    prog(74, 'Building 3D scene…');
    await yld();
    buildScene();

    prog(88, 'Building UI…');
    buildSidebar();
    fitAll();

    document.getElementById('stat-clusters').textContent = clusterNames.length;
    document.getElementById('stat-birds').textContent    = total.toLocaleString();
    document.getElementById('cp-count').textContent      =
      `${clusterNames.length} clusters · ${total.toLocaleString()} birds`;

    prog(100, 'Ready');
    document.getElementById('loading').classList.add('gone');
    animate();

  } catch (e) {
    console.error(e);
    document.getElementById('ld-s').textContent = 'Error: ' + e.message;
  }
}

function buildArrays(raw) {
  total  = raw.length;
  allPos = new Float32Array(total * 4);

  const counts = new Int32Array(clusterNames.length);
  for (let i = 0; i < total; i++) counts[raw[i][2]]++;

  clusterXY = clusterNames.map((_, ci) => new Float32Array(counts[ci] * 2));
  const offs = new Int32Array(clusterNames.length);

  for (let i = 0; i < total; i++) {
    const [x, y, ci, id] = raw[i];
    allPos[i*4] = x; allPos[i*4+1] = y; allPos[i*4+2] = ci; allPos[i*4+3] = id;
    const o = offs[ci];
    clusterXY[ci][o*2] = x; clusterXY[ci][o*2+1] = y;
    offs[ci]++;
  }
}


// ── Cluster separation (identical to 2D version) ──────────────────
//
// Spreads cluster centroids outward and compresses each cluster so
// they form tight, well-separated islands in the XY plane.
//
function separateClusters() {
  const NC = clusterNames.length;
  if (NC < 2) return;

  const ctrX = new Float64Array(NC);
  const ctrY = new Float64Array(NC);
  const cnt  = new Int32Array(NC);
  for (let i = 0; i < allPos.length; i += 4) {
    const ci = allPos[i+2] | 0;
    ctrX[ci] += allPos[i];
    ctrY[ci] += allPos[i+1];
    cnt[ci]++;
  }
  for (let ci = 0; ci < NC; ci++) {
    if (cnt[ci] > 0) { ctrX[ci] /= cnt[ci]; ctrY[ci] /= cnt[ci]; }
  }

  let gcx = 0, gcy = 0;
  for (let ci = 0; ci < NC; ci++) { gcx += ctrX[ci]; gcy += ctrY[ci]; }
  gcx /= NC; gcy /= NC;

  const SPREAD = 4.2;
  const sCtrX = new Float64Array(NC);
  const sCtrY = new Float64Array(NC);
  for (let ci = 0; ci < NC; ci++) {
    sCtrX[ci] = gcx + (ctrX[ci] - gcx) * SPREAD;
    sCtrY[ci] = gcy + (ctrY[ci] - gcy) * SPREAD;
  }

  const allowedR = new Float64Array(NC).fill(1e9);
  for (let ci = 0; ci < NC; ci++) {
    for (let cj = 0; cj < NC; cj++) {
      if (ci === cj) continue;
      const dx   = sCtrX[ci] - sCtrX[cj];
      const dy   = sCtrY[ci] - sCtrY[cj];
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist * 0.44 < allowedR[ci]) allowedR[ci] = dist * 0.44;
    }
    if (allowedR[ci] === 1e9) allowedR[ci] = 10;
  }

  const actualR = new Float64Array(NC);
  for (let i = 0; i < allPos.length; i += 4) {
    const ci = allPos[i+2] | 0;
    const dx = allPos[i]   - ctrX[ci];
    const dy = allPos[i+1] - ctrY[ci];
    const r  = Math.sqrt(dx*dx + dy*dy);
    if (r > actualR[ci]) actualR[ci] = r;
  }

  for (let i = 0; i < allPos.length; i += 4) {
    const ci    = allPos[i+2] | 0;
    const scale = actualR[ci] > 0.001 ? allowedR[ci] / actualR[ci] : 1;
    allPos[i]   = sCtrX[ci] + (allPos[i]   - ctrX[ci]) * scale;
    allPos[i+1] = sCtrY[ci] + (allPos[i+1] - ctrY[ci]) * scale;
  }

  for (let ci = 0; ci < NC; ci++) {
    const pts   = clusterXY[ci];
    const scale = actualR[ci] > 0.001 ? allowedR[ci] / actualR[ci] : 1;
    for (let j = 0; j < pts.length; j += 2) {
      pts[j]   = sCtrX[ci] + (pts[j]   - ctrX[ci]) * scale;
      pts[j+1] = sCtrY[ci] + (pts[j+1] - ctrY[ci]) * scale;
    }
  }

  for (let ci = 0; ci < NC; ci++) {
    centroids[ci] = [sCtrX[ci], sCtrY[ci]];
  }
}


// ── Convex hull (Andrew's monotone chain) ─────────────────────────
function convexHull(flatXY) {
  const n = flatXY.length >> 1;
  if (n < 3) {
    const r = [];
    for (let i = 0; i < n; i++) r.push([flatXY[i*2], flatXY[i*2+1]]);
    return r;
  }
  const pts = [];
  for (let i = 0; i < flatXY.length; i += 2) pts.push([flatXY[i], flatXY[i+1]]);
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);

  const cross = (O, A, B) =>
    (A[0] - O[0]) * (B[1] - O[1]) - (A[1] - O[1]) * (B[0] - O[0]);

  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length-2], lower[lower.length-1], p) <= 0)
      lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = pts.length - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length-2], upper[upper.length-1], p) <= 0)
      upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

function computeHulls() {
  hulls = clusterXY.map(xy => convexHull(xy));
}


// ── Spatial grid (XY plane) ───────────────────────────────────────
function buildGrid() {
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for (let i = 0; i < allPos.length; i += 4) {
    if (allPos[i]   < mnX) mnX = allPos[i];
    if (allPos[i]   > mxX) mxX = allPos[i];
    if (allPos[i+1] < mnY) mnY = allPos[i+1];
    if (allPos[i+1] > mxY) mxY = allPos[i+1];
  }
  const px = (mxX - mnX) * 0.01, py = (mxY - mnY) * 0.01;
  gMinX = mnX - px; gMinY = mnY - py;
  gCellW = (mxX - mnX + px*2) / G;
  gCellH = (mxY - mnY + py*2) / G;

  const cnt = new Int32Array(G * G);
  for (let i = 0; i < allPos.length; i += 4) {
    const c = clamp(((allPos[i]   - gMinX) / gCellW) | 0, 0, G-1);
    const r = clamp(((allPos[i+1] - gMinY) / gCellH) | 0, 0, G-1);
    cnt[r*G + c]++;
  }
  grid = [];
  const off = new Int32Array(G * G);
  for (let k = 0; k < G*G; k++) grid.push(new Int32Array(cnt[k]));
  for (let i = 0; i < allPos.length; i += 4) {
    const c = clamp(((allPos[i]   - gMinX) / gCellW) | 0, 0, G-1);
    const r = clamp(((allPos[i+1] - gMinY) / gCellH) | 0, 0, G-1);
    const k = r*G + c; grid[k][off[k]++] = i;
  }
}

// Returns allPos indices for a world-space XY rectangle (+ expandWorld margin)
function* visibleGridXY(expandWorld = 0) {
  // Approximate the visible XY extent from the camera's perspective.
  // We use the camera→target distance and FOV to compute half-extents,
  // then add expandWorld as a safety margin.
  const dist = camera.position.distanceTo(controls.target);
  const vFOV = camera.fov * Math.PI / 180;
  const halfH = dist * Math.tan(vFOV / 2) + expandWorld;
  const halfW = halfH * camera.aspect + expandWorld;

  const tx = controls.target.x, ty = controls.target.y;

  const c0 = clamp(((tx - halfW - gMinX) / gCellW) | 0, 0, G-1);
  const c1 = clamp(((tx + halfW - gMinX) / gCellW) | 0, 0, G-1);
  const r0 = clamp(((ty - halfH - gMinY) / gCellH) | 0, 0, G-1);
  const r1 = clamp(((ty + halfH - gMinY) / gCellH) | 0, 0, G-1);

  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const cell = grid[r*G + c];
    for (let j = 0; j < cell.length; j++) yield cell[j];
  }
}


// ── Z coordinate assignment ───────────────────────────────────────
//
// Each bird gets a stable, deterministic Z value derived from its ID.
// This spreads the birds that are stacked at the same XY position into
// depth, so orbiting sideways reveals images that are hidden from above.
//
function assignZ() {
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for (let i = 0; i < allPos.length; i += 4) {
    if (allPos[i]   < mnX) mnX = allPos[i];
    if (allPos[i]   > mxX) mxX = allPos[i];
    if (allPos[i+1] < mnY) mnY = allPos[i+1];
    if (allPos[i+1] > mxY) mxY = allPos[i+1];
  }
  dataMinX = mnX; dataMinY = mnY;
  dataW = mxX - mnX; dataH = mxY - mnY;

  const ZA = Math.max(dataW, dataH) * C.Z_SPREAD;
  allZ = new Float32Array(total);

  for (let i = 0; i < allPos.length; i += 4) {
    const id = allPos[i+3];
    // Two-step hash → smooth float in (-1, 1)
    const s  = Math.sin(id * 12345.6789) * 43758.5453;
    const t  = (s - Math.floor(s)) * 2 - 1;
    allZ[i >> 2] = t * ZA;
  }
}


// ── 3D scene construction ─────────────────────────────────────────
function buildScene() {
  buildHullMeshes();
  buildPointCloud();
  initSpritePool();
}

// Cluster territory regions — flat fill + outline at Z ≈ 0
function buildHullMeshes() {
  for (let ci = 0; ci < hulls.length; ci++) {
    const hull = hulls[ci];
    if (hull.length < 3) continue;

    const color = new THREE.Color(colorsHex[ci]);

    // Filled territory
    const shape   = new THREE.Shape(hull.map(p => new THREE.Vector2(p[0], p[1])));
    const fillGeo = new THREE.ShapeGeometry(shape);
    const fillMat = new THREE.MeshBasicMaterial({
      color, transparent: true,
      opacity: C.HULL_ALPHA_FILL,
      side: THREE.DoubleSide,
      depthWrite: false,
    });
    const fill = new THREE.Mesh(fillGeo, fillMat);
    fill.position.z = -0.05;
    scene.add(fill);

    // Outline
    const pts3  = hull.map(p => new THREE.Vector3(p[0], p[1], -0.02));
    pts3.push(pts3[0].clone());
    const lineGeo = new THREE.BufferGeometry().setFromPoints(pts3);
    const lineMat = new THREE.LineBasicMaterial({
      color, transparent: true, opacity: C.HULL_ALPHA_LINE,
    });
    scene.add(new THREE.Line(lineGeo, lineMat));
  }
}

// One THREE.Points object for every bird — 1 GPU draw call
function buildPointCloud() {
  const positions = new Float32Array(total * 3);
  const colors    = new Float32Array(total * 3);

  for (let i = 0; i < allPos.length; i += 4) {
    const bi  = i >> 2;
    const ci  = allPos[i+2] | 0;
    const hex = colorsHex[ci];
    positions[bi*3]   = allPos[i];
    positions[bi*3+1] = allPos[i+1];
    positions[bi*3+2] = allZ[bi];
    colors[bi*3]   = parseInt(hex.slice(1,3), 16) / 255;
    colors[bi*3+1] = parseInt(hex.slice(3,5), 16) / 255;
    colors[bi*3+2] = parseInt(hex.slice(5,7), 16) / 255;
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

  pointsObj = new THREE.Points(geom, new THREE.PointsMaterial({
    size: 0.12,
    vertexColors: true,
    sizeAttenuation: true,
    transparent: true,
    opacity: 0.65,
  }));
  scene.add(pointsObj);
}

// Pre-create a fixed pool of Sprites so we never allocate during rendering
function initSpritePool() {
  for (let i = 0; i < C.MAX_SPRITES; i++) {
    const mat = new THREE.SpriteMaterial({
      transparent: true,
      depthTest:   true,
      depthWrite:  false,
      sizeAttenuation: true,
    });
    const s  = new THREE.Sprite(mat);
    s.visible  = false;
    s._birdId  = -1;
    s._seq     = 0;
    scene.add(s);
    pool.push(s);
  }
}


// ── Camera fit ────────────────────────────────────────────────────
function fitAll() {
  const cx = dataMinX + dataW / 2;
  const cy = dataMinY + dataH / 2;

  const vFOV = camera.fov * Math.PI / 180;
  const hFOV = 2 * Math.atan(Math.tan(vFOV / 2) * camera.aspect);
  const distY = (dataH / 2) / Math.tan(vFOV  / 2);
  const distX = (dataW / 2) / Math.tan(hFOV  / 2);
  const dist  = Math.max(distX, distY) * 1.3;

  fly = {
    pos0: camera.position.clone(),
    pos1: new THREE.Vector3(cx, cy, dist),
    tgt0: controls.target.clone(),
    tgt1: new THREE.Vector3(cx, cy, 0),
    t0:   performance.now(),
  };

  // Calibrate world-space sprite size so they appear SPRITE_INIT_PX pixels
  // at this view distance — same idea as WORLD_IMG_SIZE in the 2D version.
  const worldH = 2 * dist * Math.tan(vFOV / 2);
  SPRITE_WORLD = (C.SPRITE_INIT_PX / innerHeight) * worldH;
}


// ── Render / animation loop ───────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  // Advance fly-to animation
  if (fly) {
    const t = Math.min((performance.now() - fly.t0) / C.FLY_MS, 1);
    const e = 1 - (1 - t) ** 3; // cubic ease-out
    camera.position.lerpVectors(fly.pos0, fly.pos1, e);
    controls.target.lerpVectors(fly.tgt0, fly.tgt1, e);
    controls.update();
    if (t >= 1) fly = null;
  } else {
    controls.update(); // needed for damping
  }

  updateSprites();
  drawLabels();

  const dist = camera.position.distanceTo(controls.target);
  document.getElementById('hud-zoom').textContent = `dist ${Math.round(dist)}`;

  renderer.render(scene, camera);
}


// ── Sprite management ─────────────────────────────────────────────
//
// Each frame:
//   1. Iterate visible birds via spatial grid
//   2. For birds whose image is cached → assign a pooled Sprite, position it
//   3. For uncached birds → queue them for loading (priority by screen distance)
//   4. Hide sprites for birds that left the viewport
//
function updateSprites() {
  const W = innerWidth, H = innerHeight;
  const cxS = W / 2, cyS = H / 2;

  // Current sprite world size — grow slightly as user zooms in, cap at IMG_PX_MAX
  const dist    = camera.position.distanceTo(controls.target);
  const vFOV    = camera.fov * Math.PI / 180;
  const worldH  = 2 * dist * Math.tan(vFOV / 2);
  const pxPerW  = H / worldH;
  // Desired screen size in pixels, capped at IMG_PX_MAX
  const desiredPx   = Math.min(pxPerW * SPRITE_WORLD, C.IMG_PX_MAX);
  const spriteWorld = desiredPx / pxPerW;

  const wantedBirds = new Set();
  let count = 0;

  // Expand the grid search by one sprite-width so sprites at the edge load in
  for (const pi of visibleGridXY(SPRITE_WORLD * 3)) {
    if (count >= C.MAX_SPRITES) break;

    const id = allPos[pi+3] | 0;
    const bi = pi >> 2;

    // Project to screen to get priority distance and frustum-cull
    const vec = new THREE.Vector3(allPos[pi], allPos[pi+1], allZ[bi]);
    vec.project(camera);
    if (vec.z > 1) continue; // behind camera or beyond far plane

    const sx = (vec.x + 1) / 2 * W;
    const sy = (1 - (vec.y + 1) / 2) * H;
    if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) continue;

    const entry = imgCache.get(id);

    if (entry && entry !== 'loading' && entry !== 'error') {
      entry.seq = ++lruSeq;
      wantedBirds.add(id);

      let sp = birdSprite.get(id);
      if (!sp) {
        sp = acquireSprite(id);
        if (!sp) break; // pool exhausted
        birdSprite.set(id, sp);
      }

      sp.position.set(allPos[pi], allPos[pi+1], allZ[bi]);
      sp.scale.setScalar(spriteWorld);

      // Only update material when texture changes (avoid unnecessary GPU uploads)
      if (sp.material.map !== entry.texture) {
        sp.material.map = entry.texture;
        sp.material.needsUpdate = true;
      }

      sp._seq   = ++spriteSeq;
      sp._birdId = id;
      sp.visible = true;
      count++;

    } else if (!entry || entry === 'error') {
      const d2 = (sx - cxS) ** 2 + (sy - cyS) ** 2;
      if (imgQueue.size < C.MAX_QUEUE && !imgQueue.has(id)) imgQueue.set(id, d2);
    }
  }

  // Return sprites for birds no longer in view to the pool
  for (const [id, sp] of birdSprite) {
    if (!wantedBirds.has(id)) {
      sp.visible = false;
      sp._birdId = -1;
      sp._seq    = 0;
      birdSprite.delete(id);
    }
  }

  pumpQueue();
}

// Grab a free sprite from the pool; if none free, evict the LRU one
function acquireSprite(birdId) {
  // Look for an unoccupied sprite first
  for (const sp of pool) {
    if (!sp.visible) return sp;
  }
  // Evict least-recently-used
  let lruSp = null, lruVal = Infinity;
  for (const sp of pool) {
    if (sp._seq < lruVal) { lruVal = sp._seq; lruSp = sp; }
  }
  if (lruSp && lruSp._birdId >= 0) birdSprite.delete(lruSp._birdId);
  return lruSp;
}


// ── Image / texture loading (same pipeline as 2D canvas version) ──
function pumpQueue() {
  if (imgQueue.size === 0 || imgLoads >= C.MAX_LOADS) return;
  const sorted = [...imgQueue.entries()].sort((a, b) => a[1] - b[1]);
  for (const [id] of sorted) {
    if (imgLoads >= C.MAX_LOADS) break;
    if (imgCache.has(id)) { imgQueue.delete(id); continue; }
    imgQueue.delete(id);
    imgLoads++;
    imgCache.set(id, 'loading');
    texLoader.load(
      `/api/bird_crop/${id}`,
      (texture) => {
        imgCache.set(id, { texture, seq: ++lruSeq });
        imgLoads--;
        evict();
        pumpQueue();
      },
      undefined,
      () => { imgCache.set(id, 'error'); imgLoads--; pumpQueue(); }
    );
  }
}

function evict() {
  if (imgCache.size <= C.MAX_IMG_CACHE) return;
  const loaded = [...imgCache.entries()]
    .filter(([, v]) => v !== 'loading' && v !== 'error')
    .sort((a, b) => a[1].seq - b[1].seq);
  const need = imgCache.size - C.MAX_IMG_CACHE;
  for (let i = 0; i < need && i < loaded.length; i++) {
    loaded[i][1].texture.dispose(); // free GPU memory
    imgCache.delete(loaded[i][0]);
  }
}


// ── Cluster label overlay ─────────────────────────────────────────
//
// We project each cluster centroid into screen space and draw text
// on a 2D overlay canvas — same fade-in-on-zoom behaviour as the 2D version.
//
function drawLabels() {
  lctx.clearRect(0, 0, lblCanvas.width, lblCanvas.height);

  // Compute zoom-equivalent (px per world unit) for alpha fade
  const dist   = camera.position.distanceTo(controls.target);
  const vFOV   = camera.fov * Math.PI / 180;
  const worldH = 2 * dist * Math.tan(vFOV / 2);
  const zoomEq = innerHeight / worldH;

  const alpha = smoothstep(4, 12, zoomEq);
  if (alpha < 0.02) return;

  const fs = clamp(zoomEq * 0.85, 9, 15);
  lctx.font = `700 ${fs}px -apple-system, sans-serif`;

  for (let ci = 0; ci < centroids.length; ci++) {
    const [cx, cy] = centroids[ci];
    const vec = new THREE.Vector3(cx, cy, 0);
    vec.project(camera);

    if (vec.z > 1 || vec.z < -1) continue; // clipped

    const sx = (vec.x + 1) / 2 * innerWidth;
    const sy = (1 - (vec.y + 1) / 2) * innerHeight;
    if (sx < -80 || sx > innerWidth+80 || sy < -24 || sy > innerHeight+24) continue;

    const name = clusterNames[ci];
    const tw   = lctx.measureText(name).width;
    const th   = fs * 1.3;
    const pad  = 5;

    lctx.globalAlpha = alpha;
    lctx.fillStyle = 'rgba(7,7,15,0.82)';
    lctx.beginPath();
    if (lctx.roundRect) {
      lctx.roundRect(sx - tw/2 - pad, sy - th/2 - pad/2, tw + pad*2, th + pad, (th + pad) / 2);
    } else {
      lctx.rect(sx - tw/2 - pad, sy - th/2 - pad/2, tw + pad*2, th + pad);
    }
    lctx.fill();

    lctx.fillStyle    = colorsHex[ci];
    lctx.textAlign    = 'center';
    lctx.textBaseline = 'middle';
    lctx.fillText(name, sx, sy);
    lctx.globalAlpha = 1;
  }

  lctx.textAlign    = 'left';
  lctx.textBaseline = 'alphabetic';
}


// ── Event binding ─────────────────────────────────────────────────
function bindEvents() {
  // Click vs drag: track whether mouse moved between down and up
  canvasEl.addEventListener('mousedown', e => {
    if (e.button === 0) { mouseDownXY = { x: e.clientX, y: e.clientY }; wasDrag = false; }
  });
  canvasEl.addEventListener('mousemove', e => {
    if (mouseDownXY) {
      const dx = e.clientX - mouseDownXY.x, dy = e.clientY - mouseDownXY.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) wasDrag = true;
    }
    clearTimeout(hovTimer);
    hovTimer = setTimeout(() => detectHover(e.clientX, e.clientY), 30);
  });
  canvasEl.addEventListener('click', e => {
    if (!wasDrag) selectBird(e.clientX, e.clientY);
    mouseDownXY = null;
  });
  canvasEl.addEventListener('mouseleave', () => {
    mouseDownXY = null;
    clearHover();
  });
  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'f' || e.key === 'F') fitAll();
    if (e.key === 'Escape') deselectBird();
  });
}


// ── Hover detection ───────────────────────────────────────────────
function detectHover(mx, my) {
  if (!pointsObj) return;
  const mouse = new THREE.Vector2(
    (mx / innerWidth)  *  2 - 1,
    (my / innerHeight) * -2 + 1,
  );
  const dist = camera.position.distanceTo(controls.target);
  raycaster.params.Points.threshold = Math.max(0.08, dist * 0.007);
  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObject(pointsObj);
  if (hits.length > 0) {
    const idx = hits[0].index;
    const id  = allPos[idx*4+3] | 0;
    const ci  = allPos[idx*4+2] | 0;
    if (id !== hovId) {
      hovId = id; hovPosIdx = idx * 4;
      showTooltip(mx, my, id, ci);
    }
  } else if (hovId >= 0) {
    clearHover();
  }
}

function clearHover() {
  hovId = -1; hovPosIdx = -1;
  document.getElementById('tip').style.display = 'none';
}

function showTooltip(mx, my, id, ci) {
  const tip = document.getElementById('tip');
  document.getElementById('tip-img').src          = `/api/bird_crop/${id}`;
  document.getElementById('tip-name').textContent = clusterNames[ci] || '?';
  document.getElementById('tip-id').textContent   = `Bird #${id}`;
  const TW = 130, TH = 148;
  let tx = mx + 16, ty = my - 16;
  if (tx + TW > innerWidth  - (panelOpen ? 244 : 10)) tx = mx - TW - 16;
  if (ty + TH > innerHeight - 10) ty = my - TH;
  tip.style.left    = tx + 'px';
  tip.style.top     = ty + 'px';
  tip.style.display = 'block';
}


// ── Bird selection ────────────────────────────────────────────────
function selectBird(mx, my) {
  if (!pointsObj) return;
  const mouse = new THREE.Vector2(
    (mx / innerWidth)  *  2 - 1,
    (my / innerHeight) * -2 + 1,
  );
  const dist = camera.position.distanceTo(controls.target);
  raycaster.params.Points.threshold = Math.max(0.12, dist * 0.009);
  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObject(pointsObj);
  if (hits.length === 0) return;

  const idx    = hits[0].index;
  const posIdx = idx * 4;
  const id     = allPos[posIdx+3] | 0;
  const ci     = allPos[posIdx+2] | 0;

  selId = id; selPosIdx = posIdx;

  // Fly the camera close to the selected bird
  const wx = allPos[posIdx], wy = allPos[posIdx+1], wz = allZ[idx];
  const flyDist = Math.max(dist * 0.12, SPRITE_WORLD * 10);
  fly = {
    pos0: camera.position.clone(),
    pos1: new THREE.Vector3(wx, wy, wz + flyDist),
    tgt0: controls.target.clone(),
    tgt1: new THREE.Vector3(wx, wy, wz),
    t0:   performance.now(),
  };

  showDetailCard(id, ci);

  document.querySelectorAll('.ci').forEach(el => el.classList.remove('active'));
  const el = document.querySelector(`.ci[data-ci="${ci}"]`);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
}

function deselectBird() {
  selId = -1; selPosIdx = -1;
  document.getElementById('detail-card').classList.remove('visible');
}

function showDetailCard(id, ci) {
  document.getElementById('dc-img').src                = `/api/bird_crop/${id}`;
  document.getElementById('dc-species').textContent    = clusterNames[ci] || 'Unknown';
  document.getElementById('dc-id').textContent         = `Bird ID #${id}`;
  const dot = document.getElementById('dc-dot');
  dot.style.setProperty('--clr', colorsHex[ci]);
  dot.style.background = colorsHex[ci];
  document.getElementById('detail-card').classList.add('visible');
}


// ── Sidebar ───────────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('cluster-list');
  list.innerHTML = '';
  clusterNames.forEach((name, ci) => {
    const el  = document.createElement('div');
    el.className = 'ci';
    el.dataset.ci = ci;
    el.style.setProperty('--clr', colorsHex[ci]);
    el.innerHTML = `
      <span class="ci-swatch"></span>
      <span class="ci-name">${name}</span>
      <span class="ci-count">${clusterSizes[ci].toLocaleString()}</span>`;
    el.addEventListener('click', () => {
      document.querySelectorAll('.ci').forEach(e => e.classList.remove('active'));
      el.classList.add('active');
      flyToCluster(ci);
    });
    list.appendChild(el);
  });
}

function flyToCluster(ci) {
  const [tx, ty] = centroids[ci];
  const pts = clusterXY[ci];
  let mnX=Infinity,mxX=-Infinity,mnY=Infinity,mxY=-Infinity;
  for (let j = 0; j < pts.length; j += 2) {
    if (pts[j]   < mnX) mnX = pts[j];
    if (pts[j]   > mxX) mxX = pts[j];
    if (pts[j+1] < mnY) mnY = pts[j+1];
    if (pts[j+1] > mxY) mxY = pts[j+1];
  }
  const dW = Math.max(0.1, mxX - mnX), dH = Math.max(0.1, mxY - mnY);
  const vFOV = camera.fov * Math.PI / 180;
  const hFOV = 2 * Math.atan(Math.tan(vFOV / 2) * camera.aspect);
  const newDist = Math.min(Math.max(
    (dH / 2) / Math.tan(vFOV / 2),
    (dW / 2) / Math.tan(hFOV / 2)
  ) * 1.5, 280);

  fly = {
    pos0: camera.position.clone(),
    pos1: new THREE.Vector3(tx, ty, newDist),
    tgt0: controls.target.clone(),
    tgt1: new THREE.Vector3(tx, ty, 0),
    t0:   performance.now(),
  };
}

function togglePanel() {
  panelOpen = !panelOpen;
  const panel = document.getElementById('cluster-panel');
  const btn   = document.getElementById('btn-panel');
  if (panelOpen) {
    panel.classList.remove('hidden'); btn.classList.add('active');
  } else {
    panel.classList.add('hidden');    btn.classList.remove('active');
  }
}


// ── Utilities ─────────────────────────────────────────────────────
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function smoothstep(lo, hi, x) {
  const t = clamp((x - lo) / (hi - lo), 0, 1);
  return t * t * (3 - 2 * t);
}
function yld()  { return new Promise(r => setTimeout(r, 0)); }
function prog(pct, msg) {
  document.getElementById('bar-f').style.width = pct + '%';
  document.getElementById('ld-s').textContent  = msg;
}

// Perceptually distinct colour palette (identical to 2D version)
function makeColors(n) {
  return Array.from({ length: n }, (_, i) => {
    const h = (i * 360 / n + 12) % 360;
    const s = 65 + (i % 4) * 5;
    const l = 55 + (i % 3) * 7;
    return hsl2hex(h, s, l);
  });
}
function hsl2hex(h, s, l) {
  s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = n => {
    const k = (n + h / 30) % 12;
    return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
  };
  return `#${f(0).toString(16).padStart(2,'0')}${f(8).toString(16).padStart(2,'0')}${f(4).toString(16).padStart(2,'0')}`;
}
