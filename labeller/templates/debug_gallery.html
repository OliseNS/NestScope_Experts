<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gallery Debug Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0F0F0F; color: #E0E0E0; font-family: sans-serif; padding: 20px; }
        .section { margin: 30px 0; padding: 20px; background: #1A1A1A; border-radius: 8px; border: 1px solid #333; }
        h1 { color: #CC785C; margin-bottom: 20px; }
        h2 { color: #999; margin-bottom: 15px; font-size: 1.2rem; }
        .test-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .test-item { background: #252526; padding: 15px; border-radius: 6px; border: 1px solid #444; }
        .test-image { width: 100%; height: 150px; background: #0F0F0F; border-radius: 4px; margin: 10px 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .test-image img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .status { padding: 5px 10px; border-radius: 4px; margin: 5px 0; font-size: 12px; text-align: center; }
        .loading { background: #555; }
        .success { background: #2d5; color: black; font-weight: bold; }
        .error { background: #d52; color: white; font-weight: bold; }
        .url { font-size: 10px; color: #666; word-break: break-all; margin-top: 5px; }
        button { background: #CC785C; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        button:hover { background: #B86A4F; }
        .console { background: #000; color: #0f0; padding: 15px; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>🔬 Gallery Image Loading Debug</h1>

    <div class="section">
        <h2>Test 1: Direct CDN URLs (No Proxy)</h2>
        <p style="color: #999; margin-bottom: 15px;">Testing if images load directly from Macaulay Library CDN</p>
        <div class="test-grid" id="directTest"></div>
    </div>

    <div class="section">
        <h2>Test 2: Simulated Gallery (Same as Akinator)</h2>
        <p style="color: #999; margin-bottom: 15px;">This replicates the exact gallery code from the Akinator UI</p>
        <div id="simulatedGallery"></div>
        <button onclick="testAkinatorAPI()" style="margin-top: 15px;">Test Actual Akinator API</button>
    </div>

    <div class="section">
        <h2>Console Output</h2>
        <div class="console" id="console"></div>
    </div>

    <script>
        // Override console.log to show in page
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const consoleDiv = document.getElementById('console');

        function addToConsole(type, ...args) {
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
            consoleDiv.innerHTML += `<div style="color:${type === 'error' ? '#f55' : type === 'warn' ? '#fa0' : '#0f0'}">[${type.toUpperCase()}] ${msg}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        console.log = function(...args) { originalLog(...args); addToConsole('log', ...args); };
        console.error = function(...args) { originalError(...args); addToConsole('error', ...args); };
        console.warn = function(...args) { originalWarn(...args); addToConsole('warn', ...args); };

        // Test data
        const TEST_SPECIES = [
            { code: 'BRPE', name: 'Brown Pelican', url: 'https://cdn.download.ams.birds.cornell.edu/api/v1/asset/63128991/1800' },
            { code: 'GREG', name: 'Great Egret', url: 'https://cdn.download.ams.birds.cornell.edu/api/v1/asset/297385091/1800' },
            { code: 'SNEG', name: 'Snowy Egret', url: 'https://cdn.download.ams.birds.cornell.edu/api/v1/asset/302513691/1800' },
            { code: 'DCCO', name: 'Double-crested Cormorant', url: 'https://cdn.download.ams.birds.cornell.edu/api/v1/asset/297288661/1800' },
            { code: 'LAGU', name: 'Laughing Gull', url: 'https://cdn.download.ams.birds.cornell.edu/api/v1/asset/306206101/1800' },
            { code: 'ROYT', name: 'Royal Tern', url: 'https://cdn.download.ams.birds.cornell.edu/api/v1/asset/243484551/1800' }
        ];

        // Test 1: Direct URLs
        function testDirectUrls() {
            console.log('🧪 Starting direct URL test...');
            const container = document.getElementById('directTest');
            container.innerHTML = TEST_SPECIES.map(species => `
                <div class="test-item">
                    <strong>${species.code}</strong>
                    <div class="test-image">
                        <img
                            src="${species.url}"
                            alt="${species.name}"
                            onload="updateStatus('direct-${species.code}', true)"
                            onerror="updateStatus('direct-${species.code}', false, this.src)">
                    </div>
                    <div id="direct-${species.code}" class="status loading">Loading...</div>
                    <div class="url">${species.url.substring(0, 50)}...</div>
                </div>
            `).join('');
        }

        function updateStatus(id, success, url) {
            const el = document.getElementById(id);
            if (success) {
                el.className = 'status success';
                el.textContent = '✅ LOADED';
                console.log(`✅ ${id} loaded successfully`);
            } else {
                el.className = 'status error';
                el.textContent = '❌ FAILED';
                console.error(`❌ ${id} failed to load from: ${url}`);
            }
        }

        // Test 2: Simulated gallery (exact replica of Akinator code)
        function testSimulatedGallery() {
            console.log('🧪 Starting simulated gallery test...');

            // Create mock candidate data (matches API format)
            const mockCandidates = TEST_SPECIES.map((s, i) => ({
                code: s.code,
                name: s.name,
                confidence: 90 - (i * 10),
                reference_photos: [s.url],
                field_marks: ['Test mark 1', 'Test mark 2'],
                ebird_link: 'https://ebird.org',
                guide_link: 'https://allaboutbirds.org'
            }));

            console.log('Mock candidates:', mockCandidates);
            updateCandidateGallery(mockCandidates);
        }

        // Exact copy of gallery update function from Akinator
        function updateCandidateGallery(candidates) {
            const galleryHtml = `
                <div style="padding: 1rem; background: #252526; border-radius: 8px;">
                    <div style="margin-bottom: 1rem; color: #999;">
                        <strong>Possible Species:</strong>
                        <span style="color: #CC785C;">${candidates.length} candidates</span>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                        ${candidates.map(candidate => {
                            let photoUrl = '';
                            if (candidate.reference_photos && candidate.reference_photos.length > 0) {
                                photoUrl = candidate.reference_photos[0];
                                console.log(`  ${candidate.code}: ${photoUrl}`);
                            } else {
                                console.log(`  ${candidate.code}: NO PHOTO`);
                            }

                            return `
                                <div style="background: #1A1A1A; padding: 10px; border-radius: 6px; border: 1px solid #444;">
                                    <div style="width: 100%; height: 100px; background: #0F0F0F; border-radius: 4px; margin-bottom: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
                                        ${photoUrl ? `<img
                                            src="${photoUrl}"
                                            alt="${candidate.name}"
                                            crossorigin="anonymous"
                                            style="max-width: 100%; max-height: 100%; object-fit: contain;"
                                            onload="console.log('✅ Loaded ${candidate.code}')"
                                            onerror="console.error('❌ Failed ${candidate.code}'); this.parentElement.innerHTML='<div style=\\'color:#d52;\\'>Failed</div>'">` :
                                          `<div style="color: #666;">No photo</div>`}
                                    </div>
                                    <div style="text-align: center;">
                                        <div style="font-weight: 600; font-size: 14px;">${candidate.code}</div>
                                        <div style="color: #CC785C; font-size: 12px;">${candidate.confidence}%</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            document.getElementById('simulatedGallery').innerHTML = galleryHtml;
        }

        // Test actual API
        async function testAkinatorAPI() {
            console.log('🧪 Testing actual Akinator API...');
            try {
                // This would need an actual session, so just test the structure
                console.log('Would call /api/akinator/start but need a valid bird_id');
                console.log('Instead, showing that the gallery function works with real data structure');
            } catch (error) {
                console.error('API test failed:', error);
            }
        }

        // Run tests on load
        console.log('🚀 Starting tests...');
        testDirectUrls();
        testSimulatedGallery();
    </script>
</body>
</html>
