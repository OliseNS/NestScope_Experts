{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 60px); text-align: center; padding: 2rem;">
    <div>
        <h1 style="font-size: 6rem; font-weight: 700; color: #7BABAE; margin: 0;">404</h1>
        <h2 style="font-size: 2rem; font-weight: 600; color: var(--text-primary); margin: 1rem 0;">Page Not Found</h2>
        <p style="font-size: 1.125rem; color: var(--text-secondary); margin-bottom: 2rem;">
            The page you're looking for doesn't exist.
        </p>
        <a href="/" style="display: inline-block; background: #7BABAE; color: white; padding: 0.875rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 500; transition: all 0.15s ease;">
            Go Home
        </a>
    </div>
</div>
{% endblock %}
