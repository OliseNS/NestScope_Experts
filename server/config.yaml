# NestScope Server Configuration

model:
  name: anthropic/claude-sonnet-4.6 # Research-grade accuracy with 1M token context
  temperature: 0.7
  max_tokens: 1000
  sql_temperature: 0.1
  sql_max_tokens: 500

agentic:
  max_attempts: 10 # Number of retry attempts for agentic self-correction
  validation_temperature: 0.1 # Low temperature for strict validation
  analysis_temperature: 0.3 # Moderate temperature for question analysis

database:
  default_path: data/bird_data_complete.db

cv:
  # Detection model paths
  # Swift: Fast inference model (9.7MB, optimized for speed)
  # Apex: Maximum accuracy model (37MB, optimized for precision)
  model_fast: models/swift.onnx
  model_pro: models/apex.onnx
  default_confidence: 0.25
  image_size: 1024
  default_fast_mode: true  # Start in fast mode by default

  # Classification model paths
  # Swift: Fast classifier (YOLOv8n-cls, 3.5MB, ~2x faster inference)
  # Apex: Accurate classifier (YOLOv8s-cls, 12MB, better accuracy)
  classifier_swift: models/classifier_swift.pt
  classifier_apex: models/classifier_apex.pt
  classifier_species: 25

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "*"

logging:
  level: INFO
